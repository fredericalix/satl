[package]
name = "satl-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description.workspace = true
publish.workspace = true

[dependencies]
nix = { version = "0.31.3", features = ["event", "process", "signal", "fs", "user"] }
satl-core = { version = "0.2.0", path = "../satl-core" }
satl-metrics = { version = "0.2.0", path = "../satl-metrics" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["process", "rt", "fs", "time", "io-util"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
