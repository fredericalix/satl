[package]
name = "satld"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive"] }
futures-util = "0.3.33"
gethostname = "1.1.0"
http = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
rand = "0.10.2"
rustls = { version = "0.23.43", default-features = false, features = ["aws-lc-rs", "std", "logging", "tls12"] }
rustls-pemfile = "2.2.0"
rustls-pki-types = "1"
satl-agent = { version = "0.2.0", path = "../satl-agent" }
satl-api = { version = "0.2.0", path = "../satl-api" }
satl-ca = { version = "0.2.0", path = "../satl-ca" }
satl-cluster = { version = "0.2.0", path = "../satl-cluster" }
satl-core = { version = "0.2.0", path = "../satl-core" }
satl-metrics = { version = "0.2.0", path = "../satl-metrics" }
satl-dispatcher = { version = "0.2.0", path = "../satl-dispatcher" }
satl-image = { version = "0.2.0", path = "../satl-image" }
satl-net = { version = "0.2.0", path = "../satl-net" }
satl-orchestrator = { version = "0.2.0", path = "../satl-orchestrator" }
satl-overlay = { version = "0.2.0", path = "../satl-overlay" }
satl-proto = { version = "0.2.0", path = "../satl-proto" }
satl-runtime = { version = "0.2.0", path = "../satl-runtime" }
satl-sched = { version = "0.2.0", path = "../satl-sched" }
satl-storage = { version = "0.2.0", path = "../satl-storage" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "process", "net", "fs", "time", "sync", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "logging", "tls12"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = "0.7.19"
toml = "1.1.4"
tonic = "0.14.6"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
