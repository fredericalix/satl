[package]
name = "satl-overlay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description.workspace = true
publish.workspace = true

[dependencies]
libc = "0.2"
rand = "0.10.2"
satl-core = { version = "0.2.0", path = "../satl-core" }
satl-metrics = { version = "0.2.0", path = "../satl-metrics" }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-util = "0.7.19"
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "time"] }
