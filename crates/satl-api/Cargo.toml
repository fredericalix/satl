[package]
name = "satl-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
axum = "0.8"
base64 = "0.22.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
futures-util = { version = "0.3.33", default-features = false, features = ["std"] }
hyper = { version = "1.11.0", default-features = false }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio"] }
satl-core = { version = "0.1.0", path = "../satl-core" }
satl-metrics = { version = "0.1.0", path = "../satl-metrics" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["fs", "io-util", "net", "rt", "sync"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
futures-util = "0.3.33"
http = "1.5.0"
http-body-util = "0.1.4"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "io-util", "time", "sync"] }
tower = { version = "0.5.3", features = ["util"] }
