// SPDX-License-Identifier: BSD-2-Clause
// Raft: the manager <-> manager consensus transport.
//
// Mirrors SWK §11.7 and docs/architecture.md §7 (service table) and §6
// (cluster state store and Raft). It replaces the M0 `NoPeersNetwork` stub in
// `crates/satl-cluster/src/network.rs` — the implementing wave writes an
// `openraft::RaftNetwork<TypeConfig>` on top of this service.
//
// Authorization (architecture §12.5): OU `satl-manager` only, same cluster ID
// (O), not blacklisted. Two extra admission rules from SWK §11.7 that are
// policy, not transport, and must live in the server implementation:
//
//   * reject messages from blacklisted node IDs outright;
//   * reject VOTE requests from senders that are unknown or that fail the
//     health check — a partitioned node must not be able to disrupt a stable
//     leader by campaigning.
//
// This service is NEVER leader-proxied. Every manager serves it for itself;
// forwarding a raft message to the leader would corrupt the protocol.
//
// ---------------------------------------------------------------------------
// OPAQUE PAYLOADS — same decision as common.proto, applied to openraft
// ---------------------------------------------------------------------------
//
// The openraft request/response types are NOT re-modelled here. Each message
// carries `bytes payload` holding the CBOR (`ciborium`) serialization of the
// corresponding openraft type parameterized by
// `satl_cluster::types::TypeConfig` (NodeId = u64, Node = BasicNode,
// D = Proposal, R = ProposalResponse).
//
// Re-modelling raft internals in protobuf would mean maintaining a second
// definition of log entries, vote records, snapshot metadata and membership
// configs, and keeping it bit-compatible with whatever openraft's own types do
// across upgrades. openraft owns those shapes; we own the transport. The
// tradeoff is the same as in common.proto and is accepted for the same reasons.
//
// RESPONSE ENCODING: a response `payload` is the CBOR of the FULL
// `Result<Resp, RaftError<...>>` that the local `openraft::Raft` handler
// returned — raft-level errors are DATA, carried to the caller intact so it can
// feed them back to its `RaftNetwork`. gRPC status codes are reserved for
// TRANSPORT failures (unreachable peer, TLS rejection, decode failure) and map
// to `RPCError::Unreachable` / `RPCError::Network` on the client side. Do not
// flatten raft errors into gRPC statuses: openraft's retry and backoff logic
// depends on telling the two apart.

syntax = "proto3";

package satl.internal.v2;


service Raft {
  // `openraft::Raft::append_entries` — log replication and heartbeats.
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);

  // `openraft::Raft::vote` — leader election.
  rpc Vote(VoteRequest) returns (VoteResponse);

  // `openraft::Raft::install_full_snapshot` — client-streaming (SWK §11.7's
  // `StreamRaftMessage`).
  //
  // openraft 0.10 no longer chunks snapshots itself: `RaftNetworkV2` has a
  // single `full_snapshot` call and the transport owns the fragmentation. One
  // call transfers one whole snapshot as an ordered sequence of
  // `SnapshotChunk`s; the per-chunk send deadline resets after every
  // successfully sent chunk, so a large snapshot cannot time out as a whole.
  // The server answers once, after the final frame, and must not apply a
  // partially received snapshot.
  rpc FullSnapshot(stream SnapshotChunk) returns (FullSnapshotResponse);

  // `openraft::Raft::handle_transfer_leader` — the leader asks a named
  // follower to take over.
  //
  // This is the call openraft 0.9 did not have, and its absence is why
  // demoting the current leader could not complete: a follower's first
  // campaign is `leader_lease + election_timeout` after last contact, and the
  // leader's own replication keeps refreshing that lease. The request tells
  // the target to disarm its lease and campaign now, so the handover is
  // sub-second instead of the 30-40 s an ordinary election costs at SatL's
  // timings (architecture §15).
  rpc TransferLeader(TransferLeaderRequest) returns (TransferLeaderResponse);
}

message AppendEntriesRequest {
  // Raft ID of the sender. Redundant with the certificate CN -> node ID
  // mapping; carried for logging and for the blacklist check before the
  // payload is decoded.
  uint64 from = 1;
  // CBOR of `openraft::raft::AppendEntriesRequest<TypeConfig>`.
  bytes payload = 2;
}

message AppendEntriesResponse {
  // CBOR of
  // `Result<openraft::raft::AppendEntriesResponse<TypeConfig>,
  //         openraft::error::RaftError<TypeConfig>>`.
  bytes payload = 1;
}

message VoteRequest {
  // Raft ID of the candidate. See the admission rule above: an unknown or
  // unhealthy sender is refused here, before the payload reaches openraft.
  uint64 from = 1;
  // CBOR of `openraft::raft::VoteRequest<TypeConfig>`.
  bytes payload = 2;
}

message VoteResponse {
  // CBOR of
  // `Result<openraft::raft::VoteResponse<TypeConfig>,
  //         openraft::error::RaftError<TypeConfig>>`.
  bytes payload = 1;
}

// One frame of a streamed snapshot (see `FullSnapshot`).
message SnapshotChunk {
  // Raft ID of the sender. Set on the FIRST chunk; ignored afterwards.
  uint64 from = 1;

  // FIRST CHUNK ONLY: CBOR of
  // `(openraft::Vote<TypeConfig>, openraft::SnapshotMeta<TypeConfig>)` — the
  // transferring leader's vote, which the receiver hands back to
  // `Raft::install_full_snapshot` so it can reject a stale leader, and the
  // snapshot's metadata. The receiver reassembles the snapshot body from the
  // `data` fields of this and the following frames, in order.
  //
  // openraft 0.9 put an `InstallSnapshotRequest` here, carrying per-chunk
  // `offset`/`done` because openraft did its own chunking. 0.10 moved the
  // fragmentation into the transport, so the offsets are gone and the header
  // describes the whole snapshot once.
  bytes header = 2;

  // Snapshot bytes for this frame, in order. Size each frame so the encoded
  // message stays under 4 MiB (architecture §15).
  bytes data = 3;

  // True on the last frame. The server must not apply a partially received
  // snapshot; an aborted stream is discarded and the leader retries.
  bool last = 4;
}

message FullSnapshotResponse {
  // CBOR of
  // `Result<openraft::raft::SnapshotResponse<TypeConfig>,
  //         openraft::error::RaftError<TypeConfig>>`.
  bytes payload = 1;
}

message TransferLeaderRequest {
  // Raft ID of the sender (the leader handing leadership over). Subject to the
  // same admission rules as every other message on this service.
  uint64 from = 1;
  // CBOR of `openraft::raft::TransferLeaderRequest<TypeConfig>` — the
  // leader's vote, the node it designates, and the last log id that node must
  // have reached before it may become leader.
  bytes payload = 2;
}

message TransferLeaderResponse {
  // CBOR of
  // `Result<openraft::raft::TransferLeaderResponse<TypeConfig>,
  //         openraft::error::RaftError<TypeConfig>>`.
  bytes payload = 1;
}
