  /images/{name}:
    delete:
      tags:
      - Image
      summary: '`DELETE /images/{name}?force=&noprune=`.'
      description: 'Removes one reference, and the content it was the last reference to. The response is Docker''s bare array, which leaves nowhere for what the layer sweep deferred, so that count travels in the SatL-only `X-Satl-Deferred-Layers` response header (api-compat 156). Served through the `/images/{name}/*` tail wildcard: a tail whose last segment is `tag`, `json`, `push`, `history`, `get` or `load` is read as a verb, so a repository whose last component is literally one of those words has to be spelled with its tag.'
      operationId: ImageDelete
      parameters:
      - name: name
        in: path
        description: Image reference; may carry slashes.
        required: true
        schema:
          type: string
      - name: force
        in: query
        description: 'Override a refusal that says `must force`: a reference held only by terminal tasks, or an image reachable from several references. It never overrides a live claim (api-compat 161). Docker `BoolValue` semantics.'
        required: false
        schema:
          type: string
      - name: noprune
        in: query
        description: Skip the layer and content sweep, and with it the two agreeing passes it takes. Docker's meaning -- keep untagged *parent* images -- has no analogue here, because SatL images have no parents (api-compat 155, 157). Docker `BoolValue` semantics.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: What was untagged and what was deleted.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImageDeleteResponseItem'
        '404':
          description: No such image.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: 'Something still claims the image. Two arms: `(cannot be forced)` when a non-terminal task or a service that still wants tasks names it -- `force` does not override that -- and `(must force)` when only terminal tasks do, or when several references resolve to the same image (api-compat 159, 161).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Daemon error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: Not implemented by this daemon.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
