      description: 'Reclaims images, layers and blobs on **this node only** (api-compat #130). A layer dataset is destroyed only when two consecutive passes 1.5 s apart agree it is unreferenced; what the sweep deferred comes back in a `Deferred` array Docker has no equivalent for (api-compat #131). A pull in flight stops content reclamation for that pass and says so (api-compat #133).'
