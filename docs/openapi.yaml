      summary: '`GET /events?since=&until=&filters=`.'
      description: '**Newline-delimited JSON, not a JSON array.** The 200 body is a chunked stream carrying one JSON object per line, terminated by `\n`, written as each event happens; a client must read it line by line and never buffer it as a single document. The schema below describes one such line. `filters` is not read at all -- no key is validated either, so a nonsense filter passes as silently as a real one (api-compat #21); `?since=` is accepted but there is no replayable history (api-compat #37), and `?until=` is a 501. The legacy top-level `status`/`id`/`from` fields are omitted.'
