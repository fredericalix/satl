    ImageInspectResponse:
      type: object
      description: |-
        `GET /images/{name}/json` — Docker's `ImageInspect`.

        Aggregated by image ID, where [`ImageSummaryResponse`] is one row per
        stored reference (api-compat 160). Several fields are structurally empty
        rather than absent, because Docker clients read them positionally:
        `Parent`, `Comment`, `Author` and `DockerVersion` have no source in an OCI
        pull (api-compat #41), and `Config.Labels` is `null` because the image
        config parser does not read a `Labels` block.
      required:
      - Id
      - RepoTags
      - RepoDigests
      - Parent
      - Comment
      - Created
      - Author
      - Config
      - Architecture
      - Os
      - Size
      - VirtualSize
      - GraphDriver
      - RootFS
      properties:
        Architecture:
          type: string
          description: Architecture (`amd64`).
        Author:
          type: string
          description: Always empty.
        Comment:
          type: string
          description: Always empty.
        Config:
          $ref: '#/components/schemas/ImageInspectConfig'
          description: The runnable configuration.
        Created:
          type: string
          description: |-
            Creation time, RFC 3339 with nanoseconds; the zero time when the image
            config carried none.
        GraphDriver:
          $ref: '#/components/schemas/ImageGraphDriver'
          description: Storage driver block; always the ZFS driver with no data.
        Id:
          type: string
          description: Image ID (`sha256:…`) — SatL's is the manifest digest.
        Os:
          type: string
          description: Operating system (`freebsd`).
        Parent:
          type: string
          description: 'Parent image ID; always empty (api-compat #41).'
        Platform:
          type:
          - string
          - 'null'
          description: Image platform, `os/arch` — **SatL extension**, as on the summary.
        RepoDigests:
          type: array
          items:
            type: string
          description: Every `repository@digest` resolving to this image.
        RepoTags:
          type: array
          items:
            type: string
          description: Every `repository:tag` resolving to this image.
        RootFS:
          $ref: '#/components/schemas/ImageRootFs'
          description: |-
            The rootfs layer list. Docker spells this `RootFS`, which `PascalCase`
            would render `RootFs`, so it is renamed explicitly — the same class of
            irregular spelling as `ImageID` and `OSType` elsewhere in this file.
        Size:
          type: integer
          format: int64
          description: |-
            Total size in bytes — the sum of the manifest's **compressed** layer
            sizes, where Docker reports the uncompressed rootfs.
        VirtualSize:
          type: integer
          format: int64
          description: Deprecated alias of `Size`, kept for older clients.
    ImageRootFs:
      type: object
      description: The `RootFS` block of an [`ImageInspectResponse`].
      required:
      - Type
      - Layers
      properties:
        Layers:
          type: array
          items:
            type: string
          description: The diff IDs, base first.
        Type:
          type: string
          description: Always `layers`.
    ImageSummaryResponse:
      type: object
      description: One entry of `GET /images/json`.
      required:
      - Id
      - ParentId
      - RepoTags
      - RepoDigests
      - Created
      - Size
      - SharedSize
      - VirtualSize
      - Containers
      properties:
        Containers:
          type: integer
          format: int64
          description: Containers using this image, `-1` when not counted.
        Created:
          type: integer
          format: int64
          description: Creation time, unix seconds.
        Id:
          type: string
          description: Image ID (`sha256:…`).
        Labels:
          type:
          - object
          - 'null'
          description: Labels; `null` when the image has none (Docker's shape).
          additionalProperties:
            type: string
          propertyNames:
            type: string
        ParentId:
          type: string
          description: Parent image ID.
        Platform:
          type:
          - string
          - 'null'
          description: Image platform, `os/arch` — **SatL extension**.
        RepoDigests:
          type: array
          items:
            type: string
          description: '`repository@digest` strings.'
        RepoTags:
          type: array
          items:
            type: string
          description: '`repository:tag` strings.'
        SharedSize:
          type: integer
          format: int64
          description: Bytes shared with other images.
        Size:
          type: integer
          format: int64
          description: On-disk size in bytes.
        VirtualSize:
          type: integer
          format: int64
          description: Deprecated alias of `Size`, kept for older clients.
    ImagesPruneResponse:
      type: object
      description: |-
        `POST /images/prune` response.

        `Deferred` is SatL's addition (api-compat 131): layer chains that looked
        unreferenced on this pass but had not on the previous one, so nothing was
        done to them. Docker has no equivalent because it has no two-pass rule.
      required:
      - ImagesDeleted
      - SpaceReclaimed
      properties:
        Deferred:
          type: array
          items:
            type: string
          description: Layer chains awaiting a second agreeing pass.
        ImagesDeleted:
          type: array
          items:
            $ref: '#/components/schemas/ImageDeleteResponseItem'
          description: What was untagged and what was deleted.
        SpaceReclaimed:
          type: integer
          format: int64
          description: Bytes freed.
          minimum: 0
    InfoResponse:
      type: object
      description: |-
        `GET /info` response body — the minimal coherent v1.43 `SystemInfo` shape
        SatL serves in M0.

        Container/image counts are hard zeros until the container and image stores
        exist (M1), and [`InfoResponse::swarm`] is a static "inactive" placeholder
        until it is wired to the real cluster state in a later M0 step.
      required:
      - ID
      - Name
      - NCPU
      - MemTotal
      - OperatingSystem
      - OSVersion
      - OSType
      - Architecture
      - ServerVersion
      - Driver
      - Containers
      - ContainersRunning
      - ContainersPaused
      - ContainersStopped
      - Images
      - Swarm
      - Warnings
      properties:
        Architecture:
          type: string
          description: CPU architecture, Docker-style.
        Containers:
          type: integer
          format: int64
          description: Total number of containers (0 until M1).
        ContainersPaused:
          type: integer
          format: int64
          description: Number of paused containers (0 until M1).
        ContainersRunning:
          type: integer
          format: int64
          description: Number of running containers (0 until M1).
        ContainersStopped:
          type: integer
          format: int64
          description: Number of stopped containers (0 until M1).
        Driver:
          type: string
          description: Storage driver — always `zfs` (ZFS is mandatory in SatL).
        ID:
          type: string
          description: Unique daemon/node identifier.
        Images:
          type: integer
          format: int64
          description: Number of images (0 until M1).
        MemTotal:
          type: integer
          format: int64
          description: Total physical memory in bytes.
        NCPU:
          type: integer
          format: int64
          description: Number of logical CPUs.
        Name:
          type: string
          description: Node hostname.
        OSType:
          type: string
          description: Operating system family (`freebsd`).
        OSVersion:
          type: string
          description: Operating system release, e.g. `15.1-RELEASE`.
        OperatingSystem:
          type: string
          description: Operating system name, e.g. `FreeBSD`.
        ServerVersion:
          type: string
          description: SatL daemon version.
        Swarm:
          $ref: '#/components/schemas/SwarmInfoResponse'
          description: |-
            Swarm status section: live cluster state from
            [`Backend::swarm_status`](crate::Backend::swarm_status), or the static
            identity `satld` injected while the backend is unwired.
        Warnings:
          type: array
          items:
            type: string
          description: Daemon warnings for the client to display.
    InspectConfig:
      type: object
      description: '`Config` section of a container inspect document.'
      required:
      - Hostname
      - User
      - OpenStdin
      - Tty
      - ExposedPorts
      - Env
      - Image
      - WorkingDir
      - Labels
      properties:
        Cmd:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Command arguments.
        Entrypoint:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Entrypoint.
        Env:
          type: array
          items:
            type: string
          description: Environment.
        ExposedPorts:
          type: object
          description: 'Declared ports (`{"80/tcp": {}}`).'
          additionalProperties: {}
          propertyNames:
            type: string
        Hostname:
          type: string
          description: Hostname inside the jail.
        Image:
          type: string
          description: Image reference.
        Labels:
          type: object
          description: Labels.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        OpenStdin:
          type: boolean
          description: Whether stdin is kept open.
        Tty:
          type: boolean
          description: Whether a TTY was requested.
        User:
          type: string
          description: User the entrypoint runs as.
        WorkingDir:
          type: string
          description: Working directory.
    InspectHostConfig:
      type: object
      description: '`HostConfig` section of a container inspect document.'
      required:
      - Binds
      - Tmpfs
      - PortBindings
      - RestartPolicy
      - AutoRemove
      - NetworkMode
      - Memory
      - NanoCpus
      properties:
        AutoRemove:
          type: boolean
          description: Remove on exit.
        Binds:
          type: array
          items:
            type: string
          description: Binds as written by the client.
        Memory:
          type: integer
          format: int64
          description: Memory limit in bytes.
        NanoCpus:
          type: integer
          format: int64
          description: CPU limit in billionths of a core.
        NetworkMode:
          type: string
          description: Network mode.
        PortBindings:
          type: object
          description: Host port bindings.
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/PortBindingBody'
          propertyNames:
            type: string
        RestartPolicy:
          $ref: '#/components/schemas/RestartPolicyResponse'
          description: Restart policy.
        Tmpfs:
          type: object
          description: tmpfs mounts.
          additionalProperties:
            type: string
          propertyNames:
            type: string
    InspectNetworkSettings:
      type: object
      description: '`NetworkSettings` section of a container inspect document.'
      required:
      - Bridge
      - IPAddress
      - IPPrefixLen
      - Gateway
      - MacAddress
      - Networks
      properties:
        Bridge:
          type: string
          description: Bridge name — empty (SatL names its bridge per network).
        Gateway:
          type: string
          description: Gateway address.
        IPAddress:
          type: string
          description: Address of the container.
        IPPrefixLen:
          type: integer
          format: int32
          description: Prefix length of the network's subnet.
          minimum: 0
        MacAddress:
          type: string
          description: MAC address of the container-side epair.
        Networks:
          type: object
          description: Network name → endpoint.
          additionalProperties:
            $ref: '#/components/schemas/EndpointSettings'
          propertyNames:
            type: string
        Ports:
          type:
          - object
          - 'null'
          description: Published ports; `null` when nothing is published.
          additionalProperties:
            type:
            - array
            - 'null'
            items:
              $ref: '#/components/schemas/PortBindingBody'
          propertyNames:
            type: string
    IpamConfigWire:
      type: object
      description: One entry of `IPAM.Config`.
      properties:
        Gateway:
          type: string
          description: |-
            Gateway address. On an overlay this is **this node's** gateway, not a
            cluster-wide one (`docs/api-compat.md`).
          default: ''
        IPRange:
          type: string
          description: Sub-range addresses are allocated from.
          default: ''
        Subnet:
          type: string
          description: Subnet in CIDR form.
          default: ''
    IpamWire:
      type: object
      description: '`IPAM` of a network document, and the `IPAM` member of a create body.'
      properties:
        Config:
          type: array
          items:
            $ref: '#/components/schemas/IpamConfigWire'
          description: Subnet configuration; SatL supports at most one entry.
          default: []
        Driver:
          type: string
          description: IPAM driver; SatL has one, `default`.
          default: ''
        Options:
          type: object
          description: IPAM driver options (rejected when non-empty).
          default: {}
          additionalProperties:
            type: string
          propertyNames:
            type: string
    JoinTokensWire:
      type: object
      description: The two join tokens.
      properties:
        Manager:
          type: string
          description: Token that joins a node as a manager.
          default: ''
        Worker:
          type: string
          description: Token that joins a node as a worker.
          default: ''
    JsonErrorDetail:
      type: object
      description: '`errorDetail` of a [`JsonMessage`].'
      required:
      - message
      properties:
        message:
          type: string
          description: Failure detail.
    JsonMessage:
      type: object
      description: |-
        One line of a `POST /images/create` progress stream (Docker's
        `JSONMessage`).
      properties:
        error:
          type:
          - string
          - 'null'
          description: Fatal error message.
        errorDetail:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/JsonErrorDetail'
            description: Structured form of `error`.
        id:
          type:
          - string
          - 'null'
          description: Layer/blob the line is about.
        progress:
          type:
          - string
          - 'null'
          description: Pre-rendered progress bar.
        progressDetail:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/JsonProgressDetail'
            description: Byte counters.
        status:
          type:
          - string
          - 'null'
          description: Human-readable status.
    JsonProgressDetail:
      type: object
      description: '`progressDetail` of a [`JsonMessage`].'
      properties:
        current:
          type:
          - integer
          - 'null'
          format: int64
          description: Bytes transferred.
          minimum: 0
        total:
          type:
          - integer
          - 'null'
          format: int64
          description: Total bytes.
          minimum: 0
    LimitWire:
      type: object
      description: '`Limits` of a task template: [`ResourcesWire`] plus Docker''s `Pids` cap.'
      properties:
        MemoryBytes:
          type: integer
          format: int64
          description: Memory in bytes.
          default: 0
        NanoCPUs:
          type: integer
          format: int64
          description: CPU in billionths of a core.
          default: 0
        Pids:
          type: integer
          format: int64
          description: Process cap — rejected (no rctl mapping in M2).
          default: 0
    ManagerStatusWire:
      type: object
      description: '`ManagerStatus` of a manager node.'
      properties:
        Addr:
          type: string
          description: Address the Raft transport dials.
          default: ''
        Leader:
          type: boolean
          description: Whether this member currently leads.
          default: false
        Reachability:
          type: string
          description: '`unknown`, `unreachable` or `reachable`.'
          default: ''
    MountPoint:
      type: object
      description: One `Mounts` entry (summary and inspect share this shape).
      required:
      - Type
      - Source
      - Destination
      - Mode
      - RW
      - Propagation
      properties:
        Destination:
          type: string
          description: Path inside the container.
        Mode:
          type: string
          description: Mount mode as written by the client.
        Name:
          type:
          - string
          - 'null'
          description: Volume name, for `volume` mounts.
        Propagation:
          type: string
          description: Mount propagation — always empty on FreeBSD (nullfs has none).
        RW:
          type: boolean
          description: Whether the mount is writable.
        Source:
          type: string
          description: Host path (bind) or dataset mountpoint (volume).
        Type:
          type: string
          description: '`bind`, `volume` or `tmpfs`.'
    MountWire:
      type: object
      description: One `Mounts` entry of a container spec.
      properties:
        BindOptions:
          description: Bind-specific options — rejected (propagation has no equivalent).
        Consistency:
          type: string
          description: Mount consistency — rejected (no FreeBSD equivalent).
          default: ''
        ReadOnly:
          type: boolean
          description: Mount read-only.
          default: false
        Source:
          type: string
          description: Host path (bind) or volume name.
          default: ''
        Target:
          type: string
          description: Path inside the jail.
          default: ''
        TmpfsOptions:
          description: tmpfs-specific options — rejected in M2.
        Type:
          type: string
          description: '`bind`, `volume` or `tmpfs`.'
          default: ''
        VolumeOptions:
          description: Volume-specific options — rejected in M2.
    NetworkAttachmentConfigWire:
      type: object
      description: One `Networks` entry of a task template.
      properties:
        Aliases:
          type: array
          items:
            type: string
          description: Extra DNS names on that network.
          default: []
        Target:
          type: string
          description: Network name or ID.
          default: ''
    NetworkAttachmentWire:
      type: object
      description: One allocated network attachment of a task.
      properties:
        Addresses:
          type: array
          items:
            type: string
          description: Addresses allocated on it, in CIDR form.
          default: []
        Network:
          oneOf:
          - $ref: '#/components/schemas/NetworkRefWire'
            description: The attached network.
          default:
            ID: ''
    NetworkConfigFromWire:
      type: object
      description: '`ConfigFrom` of a network document.'
      properties:
        Network:
          type: string
          description: Name of the network the configuration comes from.
          default: ''
    NetworkConnectBody:
      type: object
      description: '`POST /networks/{id}/connect` body.'
      properties:
        Container:
          type: string
          description: Container to attach.
          default: ''
        EndpointConfig:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/EndpointConfigWire'
            description: Per-endpoint settings; only `Aliases` is honoured.
          default: null
    NetworkContainerWire:
      type: object
      description: One entry of a network document's `Containers` map.
      properties:
        EndpointID:
          type: string
          description: |-
            Endpoint ID. SatL has no separate endpoint object, so this is the task
            ID — the same value as the map key.
          default: ''
        IPv4Address:
          type: string
          description: Address in CIDR form.
          default: ''
        IPv6Address:
          type: string
          description: Always empty — no IPv6.
          default: ''
        MacAddress:
          type: string
          description: MAC address, derived from the IPv4 address.
          default: ''
        Name:
          type: string
          description: Container (= task) name.
          default: ''
    NetworkCreateBody:
      type: object
      description: |-
        `POST /networks/create` body.

        Every field is accepted on the wire and then judged in
        `crate::convert::cluster`: rejecting in the converter rather than by
        omission is what makes "SatL cannot honour this" a 400 with a reason instead
        of a silently different network.
      properties:
        Attachable:
          type: boolean
          description: Standalone containers may attach (rejected).
          default: false
        CheckDuplicate:
          type: boolean
          description: |-
            Deprecated in Docker, accepted and ignored: SatL always enforces name
            uniqueness.
          default: false
        ConfigFrom:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/NetworkConfigFromWire'
            description: Take the configuration from another network (rejected).
          default: null
        ConfigOnly:
          type: boolean
          description: A configuration-only network (rejected).
          default: false
        Driver:
          type:
          - string
          - 'null'
          description: Driver name (`bridge`, `overlay`).
          default: null
        EnableIPv6:
          type: boolean
          description: Enable IPv6 (rejected).
          default: false
        IPAM:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/IpamWire'
            description: Addressing.
          default: null
        Ingress:
          type: boolean
          description: This is the routing-mesh ingress network.
          default: false
        Internal:
          type: boolean
          description: No external connectivity (rejected).
          default: false
        Labels:
          type: object
          description: Labels.
          default: {}
          additionalProperties:
            type: string
          propertyNames:
            type: string
        Name:
          type: string
          description: Network name.
          default: ''
        Options:
          type: object
          description: |-
            Driver options; SatL reads only `encrypted` (overlay driver only) —
            any other key is a 400.
          default: {}
          additionalProperties:
            type: string
          propertyNames:
            type: string
        Scope:
          type:
          - string
          - 'null'
          description: Requested scope; SatL derives it from the driver.
          default: null
    NetworkCreateResponse:
      type: object
      description: '`POST /networks/create` response.'
      required:
      - Id
      - Warning
      properties:
        Id:
          type: string
          description: The new network's ID.
        Warning:
          type: string
          description: Non-fatal note; empty when there is none.
    NetworkDisconnectBody:
      type: object
      description: '`POST /networks/{id}/disconnect` body.'
      properties:
        Container:
          type: string
          description: Container to detach.
          default: ''
        Force:
          type: boolean
          description: Detach even when the container is not running.
          default: false
    NetworkRefWire:
      type: object
      description: The `Network` member of a task's attachment — SatL fills the ID only.
      properties:
        ID:
          type: string
          description: Network ID.
          default: ''
    NetworkResponse:
      type: object
      description: |-
        Docker's `NetworkResource` (`GET /networks`, `GET /networks/{id}`,
        `POST /networks/create`'s inspect-shaped siblings).
      properties:
        Attachable:
          type: boolean
          description: Always false — rejected at create time.
          default: false
        ConfigFrom:
          oneOf:
          - $ref: '#/components/schemas/NetworkConfigFromWire'
            description: Always empty — `ConfigFrom` is rejected at create time.
          default:
            Network: ''
        ConfigOnly:
          type: boolean
          description: Always false — `ConfigOnly` is rejected at create time.
          default: false
        Containers:
          type: object
          description: Attached containers (= tasks), keyed by ID. Populated on inspect only.
          default: {}
          additionalProperties:
            $ref: '#/components/schemas/NetworkContainerWire'
          propertyNames:
            type: string
        Created:
          type: string
          description: Creation time, RFC 3339 nanoseconds.
          default: ''
        Driver:
          type: string
          description: Driver name (`bridge`, `overlay`).
          default: ''
        EnableIPv6:
          type: boolean
          description: Always false — SatL is IPv4-only in v1.
          default: false
        IPAM:
          oneOf:
          - $ref: '#/components/schemas/IpamWire'
            description: Addressing.
          default:
            Config: []
            Driver: ''
            Options: {}
        Id:
          type: string
          description: Network ID.
          default: ''
        Ingress:
          type: boolean
          description: Whether this is the routing-mesh ingress network.
          default: false
        Internal:
          type: boolean
          description: Always false — rejected at create time.
          default: false
        Labels:
          type: object
          description: Labels.
          default: {}
          additionalProperties:
            type: string
          propertyNames:
            type: string
        Name:
          type: string
          description: Network name.
          default: ''
        Options:
          type: object
          description: |-
            Driver options: `{"encrypted": "true"}` on an encrypted overlay
            network, empty otherwise (Docker's inspect shape).
          default: {}
          additionalProperties:
            type: string
          propertyNames:
            type: string
        Scope:
          type: string
          description: '`swarm` for overlay networks, `local` for node-local bridges.'
          default: ''
        Vni:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            SatL extension: the VXLAN network identifier the allocator assigned
            (overlay networks only). Operator-visible because every vxlan(4)
            diagnostic on the box is keyed by it.
          default: null
          minimum: 0
    NetworksPruneResponse:
      type: object
      description: '`POST /networks/prune` response.'
      required:
      - NetworksDeleted
      properties:
        NetworksDeleted:
          type: array
          items:
            type: string
          description: Names of the networks removed.
    NodeDescriptionWire:
      type: object
      description: '`Description` of a node.'
      properties:
        Engine:
          oneOf:
          - $ref: '#/components/schemas/EngineDescriptionWire'
            description: Engine version and labels.
          default:
            EngineVersion: ''
            Labels: {}
            Plugins: []
        Hostname:
          type: string
          description: Kernel hostname.
          default: ''
        Platform:
          oneOf:
          - $ref: '#/components/schemas/PlatformWire'
            description: Native platform.
          default:
            Architecture: ''
            OS: ''
        Resources:
          oneOf:
          - $ref: '#/components/schemas/ResourcesWire'
            description: Schedulable capacity.
          default:
            MemoryBytes: 0
            NanoCPUs: 0
    NodeResponse:
      type: object
      description: Docker's `Node` document (`GET /nodes`, `GET /nodes/{id}`).
      properties:
        CreatedAt:
          type: string
          description: Creation time, RFC 3339 nanoseconds.
          default: ''
        Description:
          oneOf:
          - $ref: '#/components/schemas/NodeDescriptionWire'
            description: Self-reported facts.
          default:
            Engine:
              EngineVersion: ''
              Labels: {}
              Plugins: []
            Hostname: ''
            Platform:
              Architecture: ''
              OS: ''
            Resources:
              MemoryBytes: 0
              NanoCPUs: 0
        ID:
          type: string
          description: Node ID.
          default: ''
        ManagerStatus:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ManagerStatusWire'
            description: Raft-member status; `null` on workers.
          default: null
        Spec:
          oneOf:
          - $ref: '#/components/schemas/NodeSpecWire'
            description: Operator intent.
          default:
            Availability: ''
            Labels: {}
            Role: ''
        Status:
          oneOf:
          - $ref: '#/components/schemas/NodeStatusWire'
            description: Observed liveness.
          default:
            Addr: ''
            Message: ''
            State: ''
        UpdatedAt:
          type: string
          description: Last update time, RFC 3339 nanoseconds.
          default: ''
        Version:
          oneOf:
          - $ref: '#/components/schemas/ObjectVersionWire'
            description: Store version.
          default:
            Index: 0
    NodeSpecWire:
      type: object
      description: '`Spec` of a node — also the `POST /nodes/{id}/update` body.'
      properties:
        Availability:
          type: string
          description: '`active`, `pause` or `drain`.'
          default: ''
        Labels:
          type: object
          description: Operator-assigned labels.
          default: {}
          additionalProperties:
            type: string
          propertyNames:
            type: string
        Name:
          type: string
          description: Operator-assigned name.
          default: ''
        Role:
          type: string
          description: '`worker` or `manager`.'
          default: ''
    NodeStatusWire:
      type: object
      description: '`Status` of a node.'
      properties:
        Addr:
          type: string
          description: The node's advertised address.
          default: ''
        Message:
          type: string
          description: Human-readable note on the state.
          default: ''
        State:
          type: string
          description: '`unknown`, `down`, `ready` or `disconnected`.'
          default: ''
    ObjectVersionWire:
      type: object
      description: |-
        Object version envelope (`{"Index": 42}`), Docker's optimistic-concurrency
        token.
      properties:
        Index:
          type: integer
          format: int64
          description: Store version of the object.
          default: 0
          minimum: 0
    OrchestrationConfigWire:
      type: object
      description: '`Orchestration` of a cluster spec.'
      properties:
        TaskHistoryRetentionLimit:
          type: integer
          format: int64
          description: Terminated tasks kept per slot.
          default: 0
    PlacementPreferenceWire:
      type: object
      description: One `Placement.Preferences` entry. Only `Spread` is honoured.
      properties:
        Spread:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SpreadPreferenceWire'
            description: Spread across a descriptor's values.
          default: null
    PlacementWire:
      type: object
      description: '`Placement` of a task template.'
      properties:
        Constraints:
          type: array
          items:
            type: string
          description: Constraint expressions.
          default: []
        MaxReplicas:
          type: integer
          format: int64
          description: Per-node cap on tasks of the same service.
          default: 0
          minimum: 0
        Platforms:
          type: array
          items:
            $ref: '#/components/schemas/PlatformWire'
          description: Platforms the image supports.
          default: []
        Preferences:
          type: array
          items:
            $ref: '#/components/schemas/PlacementPreferenceWire'
          description: |-
            Spread preferences — only `spread` is honoured (M7d); anything else is
            a 400 at the conversion layer.
          default: []
    PlatformInfo:
      type: object
      description: '`Platform` section of [`VersionResponse`].'
      required:
      - Name
      properties:
        Name:
          type: string
          description: Product name (`SatL`).
    PlatformWire:
      type: object
      description: An `os/arch` pair, in Docker's spelling.
      properties:
        Architecture:
          type: string
          description: CPU architecture (`amd64`, `arm64`).
          default: ''
        OS:
          type: string
          description: Operating system (`freebsd`, `linux`).
          default: ''
    PortBindingBody:
      type: object
      description: One host binding inside `HostConfig.PortBindings`.
      properties:
        HostIp:
          type: string
          description: Host address to bind on; empty means every address.
          default: ''
        HostPort:
          type: string
          description: Host port as a string (Docker's wire form); empty means "auto".
          default: ''
    PortConfigWire:
      type: object
      description: One published port.
      properties:
        Name:
          type: string
          description: Optional user-facing name.
          default: ''
        Protocol:
          type: string
          description: '`tcp` or `udp`.'
          default: ''
        PublishMode:
          type: string
          description: '`ingress` or `host`.'
          default: ''
        PublishedPort:
          type: integer
          format: int32
          description: Externally published port; 0 asks for an automatic assignment.
          default: 0
          minimum: 0
        TargetPort:
          type: integer
          format: int32
          description: Port the task listens on.
          default: 0
          minimum: 0
    PortSummary:
      type: object
      description: '`Ports` entry of a container summary.'
      required:
      - PrivatePort
      - Type
      properties:
        IP:
          type:
          - string
          - 'null'
          description: Host address the port is bound on.
        PrivatePort:
          type: integer
          format: int32
          description: Port inside the container.
          minimum: 0
        PublicPort:
          type:
          - integer
          - 'null'
          format: int32
          description: Port on the host, absent when unpublished.
          minimum: 0
        Type:
          type: string
          description: '`tcp` or `udp`.'
    ProcessConfig:
      type: object
      description: |-
        `ProcessConfig` of an exec inspect document (lower-case keys, as Docker
        serializes them).
      required:
      - tty
      - entrypoint
      - arguments
      - privileged
      - user
      properties:
        arguments:
          type: array
          items:
            type: string
          description: Its arguments.
        entrypoint:
          type: string
          description: The command.
        privileged:
          type: boolean
          description: Whether the exec is privileged (always false).
        tty:
          type: boolean
          description: Whether a TTY was requested.
        user:
          type: string
          description: User the process runs as.
    RaftConfigWire:
      type: object
      description: '`Raft` of a cluster spec.'
      properties:
        ElectionTick:
          type: integer
          format: int32
          description: Election timeout in ticks.
          default: 0
          minimum: 0
        HeartbeatTick:
          type: integer
          format: int32
          description: Heartbeat interval in ticks.
          default: 0
          minimum: 0
        LogEntriesForSlowFollowers:
          type: integer
          format: int64
          description: Log entries kept for slow followers.
          default: 0
          minimum: 0
        SnapshotInterval:
          type: integer
          format: int64
          description: Snapshot every this many applied entries.
          default: 0
          minimum: 0
    RemoteManagerWire:
      type: object
      description: One entry of `Swarm.RemoteManagers`.
      required:
      - NodeID
      - Addr
      properties:
        Addr:
          type: string
          description: Address its control plane is reachable on.
        NodeID:
          type: string
          description: Manager node ID.
    ReplicatedJobModeWire:
      type: object
      description: '`ReplicatedJob` of a service mode.'
      properties:
        MaxConcurrent:
          type:
          - integer
          - 'null'
          format: int64
          description: Upper bound on simultaneously live tasks; `null` means 1.
          default: null
          minimum: 0
        TotalCompletions:
          type:
          - integer
          - 'null'
          format: int64
          description: How many clean exits finish the job; `null` means 1.
          default: null
          minimum: 0
    ReplicatedModeWire:
      type: object
      description: '`Replicated` of a service mode.'
      properties:
        Replicas:
          type:
          - integer
          - 'null'
          format: int64
          description: Desired replica count; `null` means 1 (Docker's default).
          default: null
          minimum: 0
    ResourceRequirementsWire:
      type: object
      description: '`Resources` of a task template.'
      properties:
        Limits:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/LimitWire'
            description: Hard caps, enforced via rctl(8).
          default: null
        Reservations:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ResourcesWire'
            description: Scheduler-side reservations.
          default: null
    ResourcesWire:
      type: object
      description: Compute/memory quantities (node capacity, task limits and reservations).
      properties:
        MemoryBytes:
          type: integer
          format: int64
          description: Memory in bytes.
          default: 0
        NanoCPUs:
          type: integer
          format: int64
          description: CPU in billionths of a core.
          default: 0
    RestartPolicyBody:
      type: object
      description: '`HostConfig.RestartPolicy`.'
      properties:
        MaximumRetryCount:
          type: integer
          format: int64
          description: Attempt cap for `on-failure`.
          default: 0
          minimum: 0
        Name:
          type: string
          description: '`""`/`no`, `always`, `unless-stopped` or `on-failure`.'
          default: ''
    RestartPolicyResponse:
      type: object
      description: '`RestartPolicy` as served back by inspect.'
      required:
      - Name
      - MaximumRetryCount
      properties:
        MaximumRetryCount:
          type: integer
          format: int64
          description: Attempt cap.
          minimum: 0
        Name:
          type: string
          description: Policy name.
    SecretReferenceWire:
      type: object
      description: One `Secrets` entry of a container spec.
      properties:
        File:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/FileTargetWire'
            description: |-
              Where and how the payload is materialized. Docker's CLI omits it on
              the short `--secret name` form; the converter then defaults it.
          default: null
        SecretID:
          type: string
          description: |-
            ID of the referenced secret; may be empty, in which case the daemon
            resolves `SecretName`.
          default: ''
        SecretName:
          type: string
          description: Name of the referenced secret.
          default: ''
    SecretResponse:
      type: object
      description: Docker's `Secret` document (`GET /secrets`, `GET /secrets/{id}`).
      properties:
        CreatedAt:
          type: string
          description: Creation time, RFC 3339 nanoseconds.
          default: ''
        ID:
          type: string
          description: Secret ID.
          default: ''
        Spec:
          oneOf:
          - $ref: '#/components/schemas/SecretSpecWire'
            description: The spec, always without its payload.
          default:
            Name: ''
        UpdatedAt:
          type: string
          description: Last update time, RFC 3339 nanoseconds.
          default: ''
        Version:
          oneOf:
          - $ref: '#/components/schemas/ObjectVersionWire'
            description: Store version.
          default:
            Index: 0
    SecretSpecWire:
      type: object
      description: |-
        `SecretSpec`: the document `POST /secrets/create` takes and every secret
        response echoes back — minus `Data`, which is never rendered.
      properties:
        Data:
          type:
          - string
          - 'null'
          description: Base64-encoded payload. Required on create, never rendered.
          default: null
        Driver:
          description: External secret driver — rejected (no driver plugins).
        Labels:
          type: object
          description: Free-form labels.
          default: {}
          additionalProperties:
            type: string
          propertyNames:
            type: string
        Name:
          type: string
          description: Secret name (unique across the cluster).
          default: ''
        Templating:
          description: Templating driver — rejected (no template engine).
    ServiceCreateResponse:
      type: object
      description: '`POST /services/create` response.'
      required:
      - ID
      properties:
        ID:
          type: string
          description: The new service ID.
        Warnings:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Non-fatal notes.
    ServiceModeWire:
      type: object
      description: '`Mode` of a service spec: exactly one member is set.'
      properties:
        Global:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/GlobalModeWire'
            description: One task per schedulable node.
          default: null
        GlobalJob:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/GlobalModeWire'
            description: Run-to-completion per eligible node (Docker's `GlobalJob`).
          default: null
        Replicated:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ReplicatedModeWire'
            description: A fixed number of replicas.
          default: null
        ReplicatedJob:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ReplicatedJobModeWire'
            description: Run-to-completion replicas (Docker's `ReplicatedJob`).
          default: null
    ServiceResponse:
      type: object
      description: Docker's `Service` document.
      properties:
        CreatedAt:
          type: string
          description: Creation time, RFC 3339 nanoseconds.
          default: ''
        Endpoint:
          oneOf:
          - $ref: '#/components/schemas/EndpointWire'
            description: Allocated endpoint (published ports).
          default:
            Spec: {}
        ID:
          type: string
          description: Service ID.
          default: ''
        PreviousSpec:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ServiceSpecWire'
            description: Spec before the last update, kept for rollback.
          default: null
        ServiceStatus:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ServiceStatusWire'
            description: Replica counts; only sent when `?status=` was requested.
          default: null
        Spec:
          oneOf:
          - $ref: '#/components/schemas/ServiceSpecWire'
            description: Desired state.
          default:
            Labels: {}
            Mode: {}
            Name: ''
            TaskTemplate:
              ContainerSpec:
                Image: ''
                OpenStdin: false
                ReadOnly: false
                TTY: false
              ForceUpdate: 0
        UpdateStatus:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/UpdateStatusWire'
            description: Progress of a rolling update.
          default: null
        UpdatedAt:
          type: string
          description: Last update time, RFC 3339 nanoseconds.
          default: ''
        Version:
          oneOf:
          - $ref: '#/components/schemas/ObjectVersionWire'
            description: Store version.
          default:
            Index: 0
    ServiceSpecWire:
      type: object
      description: |-
        `POST /services/create` and `POST /services/{id}/update` body — also the
        `Spec` of a rendered service.
      properties:
        EndpointSpec:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/EndpointSpecWire'
            description: Resolution mode and published ports.
          default: null
        Labels:
          type: object
          description: Service labels.
          default: {}
          additionalProperties:
            type: string
          propertyNames:
            type: string
        Mode:
          oneOf:
          - $ref: '#/components/schemas/ServiceModeWire'
            description: Replication mode.
          default: {}
        Name:
          type: string
          description: Service name.
          default: ''
        Networks:
          type: array
          items:
            $ref: '#/components/schemas/NetworkAttachmentConfigWire'
          description: Deprecated service-level networks; folded into the task template.
          default: []
        RollbackConfig:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/UpdateConfigWire'
            description: Settings used when rolling back.
          default: null
        TaskTemplate:
          oneOf:
          - $ref: '#/components/schemas/TaskTemplateWire'
            description: Template every task is stamped from.
          default:
            ContainerSpec:
              Image: ''
              OpenStdin: false
              ReadOnly: false
              TTY: false
            ForceUpdate: 0
        UpdateConfig:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/UpdateConfigWire'
            description: Rolling-update settings.
          default: null
    ServiceStatusWire:
      type: object
      description: '`ServiceStatus`: the numbers behind `satl service ls`'' `REPLICAS` column.'
      properties:
        CompletedTasks:
          type: integer
          format: int64
          description: Tasks that ran to completion.
          default: 0
          minimum: 0
        DesiredTasks:
          type: integer
          format: int64
          description: Tasks the orchestrator wants running.
          default: 0
          minimum: 0
        RunningTasks:
          type: integer
          format: int64
          description: Tasks currently running.
          default: 0
          minimum: 0
    ServiceUpdateResponse:
      type: object
      description: '`POST /services/{id}/update` response.'
      properties:
        Warnings:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Non-fatal notes.
    SpreadPreferenceWire:
      type: object
      description: '`Spread`: balance the service''s tasks across this descriptor''s values.'
      properties:
        SpreadDescriptor:
          type: string
          description: '`node.id`, `node.hostname`, `node.labels.<key>` or `engine.labels.<key>`.'
          default: ''
    StringOrList:
      oneOf:
      - type: string
        description: A bare string — a shell-style single argument.
      - type: array
        items:
          type: string
        description: The usual exec-form list.
      description: |-
        A Docker `StrSlice`: JSON accepts either a single string or an array of
        strings for `Cmd` and `Entrypoint`.
    SummaryHostConfig:
      type: object
      description: '`HostConfig` subset of a container summary.'
      required:
      - NetworkMode
      properties:
        NetworkMode:
          type: string
          description: Network mode.
    SummaryNetworkSettings:
      type: object
      description: '`NetworkSettings` subset of a container summary.'
      required:
      - Networks
      properties:
        Networks:
          type: object
          description: Network name → endpoint.
          additionalProperties:
            $ref: '#/components/schemas/EndpointSettings'
          propertyNames:
            type: string
    SwarmInfoResponse:
      type: object
      description: |-
        The `Swarm` section as it is **served** in [`InfoResponse`].

        Built either from live cluster state
        ([`Backend::swarm_status`](crate::Backend::swarm_status)) or from the
        static [`SwarmInfo`] the daemon injected at startup. `Nodes`/`Managers`
        are Docker's manager-only counters and are omitted when zero.
      required:
      - NodeID
      - NodeAddr
      - LocalNodeState
      - ControlAvailable
      - Error
      properties:
        ControlAvailable:
          type: boolean
          description: Whether this node is a manager.
        Error:
          type: string
          description: Cluster error string, empty when healthy.
        LocalNodeState:
          type: string
          description: Docker `LocalNodeState`.
        Managers:
          type: integer
          format: int64
          description: Manager members; omitted on workers.
        NodeAddr:
          type: string
          description: Address advertised to other cluster members.
        NodeID:
          type: string
          description: Node identifier within the cluster.
        Nodes:
          type: integer
          format: int64
          description: Total cluster members; omitted on workers.
        RemoteManagers:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/RemoteManagerWire'
          description: Known manager endpoints; `null` when none are known.
    SwarmInitBody:
      type: object
      description: '`POST /swarm/init` body.'
      properties:
        AdvertiseAddr:
          type: string
          description: Address other nodes dial.
          default: ''
        AutoLockManagers:
          type: boolean
          description: Lock the manager keys behind an unlock key (`--autolock`).
          default: false
        Availability:
          type: string
          description: Initial availability of this node.
          default: ''
        DataPathAddr:
          type: string
          description: Address the data plane (VXLAN) binds; accepted, unused in M2.
          default: ''
        DataPathPort:
          type: integer
          format: int32
          description: UDP port of the data plane; rejected when it is not SatL's.
          default: 0
          minimum: 0
        DefaultAddrPool:
          type: array
          items:
            type: string
          description: Address pools overlay subnets are carved from.
          default: []
        ForceNewCluster:
          type: boolean
          description: Keep the store, discard the Raft membership.
          default: false
        ListenAddr:
          type: string
          description: Address the control plane binds (`0.0.0.0:2377`).
          default: ''
        Spec:
          description: Initial cluster spec; accepted, ignored (SatL applies its defaults).
        SubnetSize:
          type: integer
          format: int32
          description: Prefix length of subnets carved from the pools.
          default: 0
          minimum: 0
    SwarmJoinBody:
      type: object
      description: '`POST /swarm/join` body.'
      properties:
        AdvertiseAddr:
          type: string
          description: Address other nodes dial.
          default: ''
        Availability:
          type: string
          description: Initial availability of this node.
          default: ''
        DataPathAddr:
          type: string
          description: Address the data plane binds; accepted, unused in M2.
          default: ''
        JoinToken:
          type: string
          description: The token that decides the joining role.
          default: ''
        ListenAddr:
          type: string
          description: Address the control plane binds.
          default: ''
        RemoteAddrs:
          type: array
          items:
            type: string
          description: Manager endpoints to try, in order.
          default: []
    SwarmResponse:
      type: object
      description: '`GET /swarm` — Docker''s `Swarm` document.'
      properties:
        CreatedAt:
          type: string
          description: Creation time, RFC 3339 nanoseconds.
          default: ''
        DataPathPort:
          type: integer
          format: int32
          description: UDP port of the VXLAN data plane.
          default: 0
          minimum: 0
        DefaultAddrPool:
          type: array
          items:
            type: string
          description: Address pools overlay subnets are carved from.
          default: []
        ID:
          type: string
          description: Cluster object ID.
          default: ''
        JoinTokens:
          oneOf:
          - $ref: '#/components/schemas/JoinTokensWire'
            description: The two join tokens.
          default:
            Manager: ''
            Worker: ''
        RootRotationInProgress:
          type: boolean
          description: Whether a root CA rotation is in flight (always false in M2).
          default: false
        Spec:
          oneOf:
          - $ref: '#/components/schemas/SwarmSpecWire'
            description: Cluster settings.
          default:
            CAConfig:
              ForceRotate: 0
              NodeCertExpiry: 0
            Dispatcher:
              HeartbeatPeriod: 0
            EncryptionConfig:
              AutoLockManagers: false
            Labels: {}
            Name: ''
            Orchestration:
              TaskHistoryRetentionLimit: 0
            Raft:
              ElectionTick: 0
              HeartbeatTick: 0
              LogEntriesForSlowFollowers: 0
              SnapshotInterval: 0
            TaskDefaults: {}
        SubnetSize:
          type: integer
          format: int32
          description: Prefix length of subnets carved from the pools.
          default: 0
          minimum: 0
        TLSInfo:
          oneOf:
          - $ref: '#/components/schemas/TlsInfoWire'
            description: Root CA material.
          default: {}
        UpdatedAt:
          type: string
          description: Last update time, RFC 3339 nanoseconds.
          default: ''
        Version:
          oneOf:
          - $ref: '#/components/schemas/ObjectVersionWire'
            description: Store version.
          default:
            Index: 0
    SwarmSpecBody:
      type: object
      description: |-
        `POST /swarm/update` body: the full cluster spec, as Docker's clients
        read-modify-write it. SatL accepts it and applies only the token rotations
        requested in the query string.
      properties:
        CAConfig:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/CaConfigWire'
            description: |-
              CA settings; a `ForceRotate` greater than the stored value starts a
              root CA rotation.
          default: null
        EncryptionConfig:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/EncryptionConfigWire'
            description: Manager-key locking (`AutoLockManagers`).
          default: null
        Labels:
          type: object
          description: Cluster labels.
          default: {}
          additionalProperties:
            type: string
          propertyNames:
            type: string
        Name:
          type: string
          description: Cluster name (always `default` in SatL).
          default: ''
    SwarmSpecWire:
      type: object
      description: '`Spec` of a [`SwarmResponse`].'
      properties:
        CAConfig:
          oneOf:
          - $ref: '#/components/schemas/CaConfigWire'
            description: Certificate authority tuning.
          default:
            ForceRotate: 0
            NodeCertExpiry: 0
        Dispatcher:
          oneOf:
          - $ref: '#/components/schemas/DispatcherConfigWire'
            description: Dispatcher tuning.
          default:
            HeartbeatPeriod: 0
        EncryptionConfig:
          oneOf:
          - $ref: '#/components/schemas/EncryptionConfigWire'
            description: Manager-key locking (always off).
          default:
            AutoLockManagers: false
        Labels:
          type: object
          description: Cluster labels.
          default: {}
          additionalProperties:
            type: string
          propertyNames:
            type: string
        Name:
          type: string
          description: Cluster name.
          default: ''
        Orchestration:
          oneOf:
          - $ref: '#/components/schemas/OrchestrationConfigWire'
            description: Task history retention (SatL keeps SwarmKit's default).
          default:
            TaskHistoryRetentionLimit: 0
        Raft:
          oneOf:
          - $ref: '#/components/schemas/RaftConfigWire'
            description: Raft tuning.
          default:
            ElectionTick: 0
            HeartbeatTick: 0
            LogEntriesForSlowFollowers: 0
            SnapshotInterval: 0
        TaskDefaults:
          oneOf:
          - $ref: '#/components/schemas/TaskDefaultsWire'
            description: Defaults stamped into task specs (empty in v1).
          default: {}
    TaskContainerStatusWire:
      type: object
      description: '`ContainerStatus` of a task status.'
      properties:
        ContainerID:
          type: string
          description: The jail name — SatL's equivalent of Docker's container ID.
          default: ''
        ExitCode:
          type: integer
          format: int64
          description: Exit code once the task terminated.
          default: 0
        PID:
          type: integer
          format: int64
          description: PID of the jail's main process.
          default: 0
    TaskDefaultsWire:
      type: object
      description: |-
        `TaskDefaults` of a cluster spec — empty in v1 (SwarmKit's only member is
        the default log driver, which lands with the log broker).
    TaskPortStatusWire:
      type: object
      description: '`PortStatus` of a task status.'
      properties:
        Ports:
          type: array
          items:
            $ref: '#/components/schemas/PortConfigWire'
          description: Bound ports.
          default: []
    TaskResponse:
      type: object
      description: Docker's `Task` document.
      properties:
        CreatedAt:
          type: string
          description: Creation time, RFC 3339 nanoseconds.
          default: ''
        DesiredState:
          type: string
          description: Target state.
          default: ''
        ID:
          type: string
          description: Task ID — also the jail name.
          default: ''
        Labels:
          type: object
          description: Task labels.
          default: {}
          additionalProperties:
            type: string
          propertyNames:
            type: string
        Name:
          type: string
          description: Task name, `<service>.<slot>.<task id>`.
          default: ''
        NetworksAttachments:
          type: array
          items:
            $ref: '#/components/schemas/NetworkAttachmentWire'
          description: Allocated network attachments.
          default: []
        NodeID:
          type: string
          description: The node this task is bound to.
          default: ''
        ServiceID:
          type: string
          description: Owning service.
          default: ''
        Slot:
          type: integer
          format: int64
          description: Replica slot, 0 for global tasks.
          default: 0
          minimum: 0
        Spec:
          oneOf:
          - $ref: '#/components/schemas/TaskTemplateWire'
            description: The spec snapshot this task runs.
          default:
            ContainerSpec:
              Image: ''
              OpenStdin: false
              ReadOnly: false
              TTY: false
            ForceUpdate: 0
        Status:
          oneOf:
          - $ref: '#/components/schemas/TaskStatusWire'
            description: Observed status.
          default:
            Message: ''
            PortStatus: {}
            State: ''
            Timestamp: ''
        UpdatedAt:
          type: string
          description: Last update time, RFC 3339 nanoseconds.
          default: ''
        Version:
          oneOf:
          - $ref: '#/components/schemas/ObjectVersionWire'
            description: Store version.
          default:
            Index: 0
    TaskRestartPolicyWire:
      type: object
      description: |-
        `RestartPolicy` of a task template (nanosecond durations, unlike the
        container `HostConfig.RestartPolicy`).
      properties:
        Condition:
          type: string
          description: '`none`, `on-failure` or `any`.'
          default: ''
        Delay:
          type: integer
          format: int64
          description: Delay before a replacement starts, in nanoseconds.
          default: 0
        MaxAttempts:
          type: integer
          format: int64
          description: Maximum attempts; 0 means unlimited.
          default: 0
          minimum: 0
        Window:
          type: integer
          format: int64
          description: Window the attempts are counted over, in nanoseconds.
          default: 0
    TaskStatusWire:
      type: object
      description: '`Status` of a task.'
      properties:
        ContainerStatus:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TaskContainerStatusWire'
            description: Jail-level runtime status.
          default: null
        Err:
          type: string
          description: Failure detail for `failed`/`rejected` tasks.
          default: ''
        Message:
          type: string
          description: Human-readable note on the transition.
          default: ''
        PortStatus:
          oneOf:
          - $ref: '#/components/schemas/TaskPortStatusWire'
            description: Host-level bound ports.
          default: {}
        State:
          type: string
          description: Observed state.
          default: ''
        Timestamp:
          type: string
          description: When this status was produced, RFC 3339 nanoseconds.
          default: ''
    TaskTemplateWire:
      type: object
      description: '`TaskTemplate` of a service spec.'
      properties:
        ContainerSpec:
          oneOf:
          - $ref: '#/components/schemas/ContainerSpecWire'
            description: What runs inside the jail.
          default:
            Image: ''
            OpenStdin: false
            ReadOnly: false
            TTY: false
        ForceUpdate:
          type: integer
          format: int64
          description: Bump to force a rolling restart without a spec change.
          default: 0
          minimum: 0
        LogDriver:
          description: Per-service log driver — rejected (the log broker lands in M4/M5).
        Networks:
          type: array
          items:
            $ref: '#/components/schemas/NetworkAttachmentConfigWire'
          description: Networks the tasks attach to.
          default: []
        Placement:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/PlacementWire'
            description: Scheduling constraints.
          default: null
        Resources:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ResourceRequirementsWire'
            description: Limits and reservations.
          default: null
        RestartPolicy:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TaskRestartPolicyWire'
            description: Restart policy.
          default: null
        Runtime:
          type: string
          description: Runtime name; only `container` (the default) is accepted.
          default: ''
    TlsInfoWire:
      type: object
      description: |-
        Root CA material. SatL fills `TrustRoot` only — the issuer members are
        DER blobs SatL has no use for (deviation in `docs/api-compat.md`).
      properties:
        TrustRoot:
          type: string
          description: Root CA certificate, PEM-encoded.
          default: ''
    UnlockKeyBody:
      type: object
      description: '`POST /swarm/unlock` body — the only call a locked manager answers.'
      properties:
        UnlockKey:
          type: string
          description: The base64 unlock key.
          default: ''
    UnlockKeyResponse:
      type: object
      description: '`GET /swarm/unlockkey` response.'
      properties:
        UnlockKey:
          type: string
          description: The current unlock key, base64; empty while autolock is off.
          default: ''
    UpdateConfigWire:
      type: object
      description: '`UpdateConfig` / `RollbackConfig` of a service spec.'
      properties:
        Delay:
          type: integer
          format: int64
          description: Pause between batches, in nanoseconds.
          default: 0
        FailureAction:
          type: string
          description: '`pause`, `continue` or `rollback`.'
          default: ''
        MaxFailureRatio:
          type: number
          format: float
          description: Tolerated fraction of failed tasks.
          default: 0.0
        Monitor:
          type: integer
          format: int64
          description: Failure-observation window after a task starts, in nanoseconds.
          default: 0
        Order:
          type: string
          description: '`stop-first` or `start-first`.'
          default: ''
        Parallelism:
          type: integer
          format: int64
          description: Slots updated concurrently; 0 means unlimited.
          default: 0
          minimum: 0
    UpdateStatusWire:
      type: object
      description: '`UpdateStatus` of a service.'
      properties:
        CompletedAt:
          type: string
          description: When it reached a final state, RFC 3339 nanoseconds.
          default: ''
        Message:
          type: string
          description: Human-readable progress note.
          default: ''
        StartedAt:
          type: string
          description: When the update began, RFC 3339 nanoseconds.
          default: ''
        State:
          type: string
          description: '`updating`, `paused`, `completed`, `rollback_started`, …'
          default: ''
    VersionResponse:
      type: object
      description: '`GET /version` response body (Docker `SystemVersion`).'
      required:
      - Platform
      - Components
      - Version
      - ApiVersion
      - MinAPIVersion
      - GitCommit
      - Os
      - Arch
      - KernelVersion
      - BuildTime
      properties:
        ApiVersion:
          type: string
          description: Docker Engine API version implemented.
        Arch:
          type: string
          description: CPU architecture, Docker-style (`amd64`, `arm64`).
        BuildTime:
          type: string
          description: Build timestamp, RFC 3339.
        Components:
          type: array
          items:
            $ref: '#/components/schemas/ComponentVersion'
          description: Per-component version reports; SatL reports a single `Engine` entry.
        GitCommit:
          type: string
          description: Git commit the daemon was built from.
        KernelVersion:
          type: string
          description: Kernel version string.
        MinAPIVersion:
          type: string
          description: Minimum negotiable Docker Engine API version.
        Os:
          type: string
          description: Operating system (`freebsd`).
        Platform:
          $ref: '#/components/schemas/PlatformInfo'
          description: 'Product platform (`{"Name": "SatL"}`).'
        Version:
          type: string
          description: SatL release version.
    VolumeCreateBody:
      type: object
      description: '`POST /volumes/create` body.'
      properties:
        Driver:
          type:
          - string
          - 'null'
          description: Driver name (`local`).
          default: null
        DriverOpts:
          type: object
          description: Driver options.
          default: {}
          additionalProperties:
            type: string
          propertyNames:
            type: string
        Labels:
          type: object
          description: Labels.
          default: {}
          additionalProperties:
            type: string
          propertyNames:
            type: string
        Name:
          type: string
          description: Volume name; empty asks the daemon to generate one.
          default: ''
    VolumeListResponse:
      type: object
      description: '`GET /volumes`.'
      required:
      - Volumes
      - Warnings
      properties:
        Volumes:
          type: array
          items:
            $ref: '#/components/schemas/VolumeResponse'
          description: The volumes.
        Warnings:
          type: array
          items:
            type: string
          description: Daemon warnings.
    VolumeResponse:
      type: object
      description: One volume, as served by create/inspect and inside a volume list.
      required:
      - Name
      - Driver
      - Mountpoint
      - CreatedAt
      - Status
      - Labels
      - Scope
      - Options
      properties:
        CreatedAt:
          type: string
          description: Creation time, RFC 3339 nanoseconds.
        Driver:
          type: string
          description: Driver name.
        Labels:
          type: object
          description: Labels.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        Mountpoint:
          type: string
          description: Host mountpoint.
        Name:
          type: string
          description: Volume name.
        Options:
          type: object
          description: Driver options.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        Scope:
          type: string
          description: Always `local` — volumes are node-local in v1.
        Status:
          type: object
          description: Driver status — always empty for the ZFS local driver.
          additionalProperties: {}
          propertyNames:
            type: string
    VolumesPruneResponse:
      type: object
      description: '`POST /volumes/prune` response.'
      required:
      - VolumesDeleted
      - SpaceReclaimed
      properties:
        SpaceReclaimed:
          type: integer
          format: int64
          description: Bytes freed.
          minimum: 0
        VolumesDeleted:
          type: array
          items:
            type: string
          description: Names of the volumes removed.
    WaitError:
      type: object
      description: '`Error` member of a [`WaitResponse`].'
      required:
      - Message
      properties:
        Message:
          type: string
          description: Failure detail.
    WaitResponse:
      type: object
      description: '`POST /containers/{id}/wait` response.'
      required:
      - StatusCode
      properties:
        Error:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/WaitError'
            description: Wait error, `null` on success.
        StatusCode:
          type: integer
          format: int64
          description: Exit code of the container's main process.
tags:
- name: Container
  description: 'Containers. A container **is** a Task of a Service (invariant #2), which is where most of the model deviations come from.'
- name: Image
  description: 'Images and layers. Node-local: an image lives on whichever node pulled it (api-compat #130).'
- name: Network
  description: 'Cluster networks. `Scope` follows the driver: `overlay` is `swarm`, `bridge` is `local` (api-compat #60).'
- name: Volume
  description: 'Node-local ZFS datasets (invariant #5); the `local` driver is the only one.'
- name: Exec
  description: 'Non-interactive exec: no TTY, stdin discarded (api-compat #17, #38).'
- name: Swarm
  description: Cluster lifecycle. A SatL node bootstraps a single-node cluster at first boot, so these answer on a fresh daemon.
- name: Node
  description: 'Cluster members: listing, inspection, promotion, demotion and removal.'
- name: Service
  description: 'Services: the orchestrated unit every container belongs to.'
- name: Task
  description: 'Tasks: immutable, one-shot, never moved and never re-executed (invariant #2).'
- name: Secret
  description: 'Secrets. A payload never reaches a worker''s disk and is never returned in a response (invariant #7).'
- name: Config
  description: 'Configs: a secret without the secrecy -- the payload is returned on list and inspect.'
- name: System
  description: 'Daemon-level endpoints: ping, version, info and the event stream.'
