              #87).
        OOMKilled:
          type: boolean
          description: Always false — FreeBSD has no OOM killer flag of this kind.
        Paused:
          type: boolean
          description: Always false — jails are not paused in v1.
        Pid:
          type: integer
          format: int64
          description: PID of the main process, 0 when not running.
        Restarting:
          type: boolean
          description: Whether a restart is in flight.
        Running:
          type: boolean
          description: Whether the container is running.
        StartedAt:
          type: string
          description: Start time, RFC 3339 nanoseconds (Go's zero time when never started).
        Status:
          type: string
          description: Docker state name.
