openapi: 3.1.0
info:
  title: SatL Engine API
  description: |-
    The Docker Engine REST API v1.43 as `satld` implements it -- the only external surface SatL has (invariant #8). Every intentional divergence from Docker carries a numbered entry in `docs/api-compat.md`, cited inline throughout this document.

    The daemon listens on the unix socket `/var/run/satl.sock`. There is no TCP listener for this API: the cluster's own protocol (`satl.internal.v1`) is a separate, node-to-node-only surface on ports 2377 and 2378.

    ## Version prefixes

    Every operation is reachable both on its bare path (`/info`) and under a Docker version prefix (`/v1.43/info`). Prefixes are accepted from 1.24 up to 1.43; a prefix outside that range is a `400` in Docker's error shape, not a 404. A leading segment that merely starts with `v` but is not `v<major>.<minor>` -- `/v1/info` -- is not version negotiation at all and routes (and 404s) as an ordinary path, where Docker would parse `1` as a version.

    ## Responses this document cannot attach to an operation

    - **Unknown path**: `404` with the body `{"message": "page not found"}`. Every Docker endpoint SatL does not implement answers this shape -- attach, commit, export, rename, restart, pause, update, top, stats, changes, archive, build, push, and the rest of the `/images/{name}/*` family (api-compat #22, #144, #152).
    - **Wrong method on a known path**: `405` with an **empty body**, where Docker returns a JSON error body. This is a deviation, recorded in the daemon-wide table of `docs/api-compat.md`.
    - **Out-of-range version prefix**: `400` with Docker's error body, minted before routing.

    ## Locked manager

    A manager whose raft data encryption key is sealed (`swarm update --autolock=true`, api-compat #151) boots into a two-route API: `GET /_ping`, so a client can see the daemon is alive, and `POST /swarm/unlock`, the one way forward. **Every other operation in this document answers `503`** with a body naming that state until the unlock key is presented. Both routes behave exactly as documented here; the rest of the surface is simply absent.

    ## Error shape

    Every non-2xx response body is Docker's `{"message": "..."}` envelope (`ErrorBody`). The mapping is fixed: `404` not found, `409` conflict, `400` invalid parameter, `501` not implemented, `503` unavailable (which includes "this node is not a swarm manager"), `500` internal.
  contact:
    name: Frederic Lempire
  license:
    name: BSD-2-Clause
  version: '1.43'
servers:
- url: /
  description: Bare paths, with no version negotiation. What the daemon serves on /var/run/satl.sock.
- url: /v{version}
  description: Docker version negotiation. Any prefix in the supported range routes exactly like the bare path; one outside it is a 400.
  variables:
    version:
      default: '1.43'
      description: Docker Engine API version. The range this daemon accepts.
      enum:
      - '1.24'
      - '1.25'
      - '1.26'
      - '1.27'
      - '1.28'
      - '1.29'
      - '1.30'
      - '1.31'
      - '1.32'
      - '1.33'
      - '1.34'
      - '1.35'
      - '1.36'
      - '1.37'
      - '1.38'
      - '1.39'
      - '1.40'
      - '1.41'
      - '1.42'
      - '1.43'
paths:
  /_ping:
    get:
      tags:
      - System
      summary: '`GET /_ping`: liveness probe plus version-negotiation headers.'
      description: 'Liveness probe. The body is the literal string `OK`; the version-negotiation headers are what clients read: `Api-Version`, `Ostype`, `Docker-Experimental` (always `false`) and no `Builder-Version` -- SatL has no BuildKit (api-compat, daemon-wide). One of the two routes a locked manager still serves.'
      operationId: SystemPing
      responses:
        '200':
          description: The daemon is alive.
          content:
            text/plain:
              schema:
                type: string
    head:
      tags:
      - System
      summary: '`HEAD /_ping`: same headers as `GET`, empty body.'
      description: The same headers as `GET /_ping`, with an empty body.
      operationId: SystemPingHead
      responses:
        '200':
          description: The daemon is alive.
  /configs:
    get:
      tags:
      - Config
      summary: '`GET /configs`.'
      description: Config rows carry their payload, as Docker's do.
      operationId: ConfigList
      parameters:
      - name: filters
        in: query
        description: 'A non-empty value is rejected with 501 rather than silently listing everything (api-compat #47).'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: One row per config.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConfigResponse'
        '500':
          description: Daemon error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: '`?filters=` was non-empty, or the daemon has no store wired.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: This node is not a swarm manager, or no manager is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /configs/create:
    post:
      tags:
      - Config
      summary: '`POST /configs/create`.'
      description: 'A config is a secret without the secrecy: the payload *is* returned on list and inspect, as Docker does. One of the two endpoints whose body *is* a payload, so it accepts a larger request body than the rest of the API.'
      operationId: ConfigCreate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigSpecWire'
        required: true
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
        '400':
          description: Invalid name, payload or body size.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: A config of that name already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Daemon error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: Not implemented by this daemon.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: This node is not a swarm manager, or no manager is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /configs/{id}:
    get:
      tags:
      - Config
      summary: '`GET /configs/{id}`.'
      description: One config, payload included.
      operationId: ConfigInspect
      parameters:
      - name: id
        in: path
        description: Config ID or name.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The config document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
        '404':
          description: No such config.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Daemon error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: Not implemented by this daemon.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: This node is not a swarm manager, or no manager is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    delete:
      tags:
      - Config
      summary: '`DELETE /configs/{id}`.'
      description: Removes a config. A config still referenced by a service is refused.
      operationId: ConfigDelete
      parameters:
      - name: id
        in: path
        description: Config ID or name.
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Removed.
        '404':
          description: No such config.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: The config is still referenced by a service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Daemon error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: Not implemented by this daemon.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: This node is not a swarm manager, or no manager is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /configs/{id}/update:
    post:
      tags:
      - Config
      summary: '`POST /configs/{id}/update`: refused, exactly as `/secrets/{id}/update` is.'
      description: '**Always 501**, exactly as `POST /secrets/{id}/update` is: a config is immutable, and rotation -- create, update the services that use it, remove the old one -- is the documented path.'
      operationId: ConfigUpdate
      parameters:
      - name: id
        in: path
        description: Config ID or name.
        required: true
        schema:
          type: string
      responses:
        '501':
          description: Configs are immutable; rotate instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /containers/create:
    post:
      tags:
      - Container
      summary: '`POST /containers/create?name=&platform=`.'
      description: 'Creates a container. In SatL a container *is* a Task of an anonymous Service (invariant #2), so `Id` is the 25-character base36 task ID rather than 64 hex characters (api-compat #1). Host options SatL cannot honour are rejected with 400 rather than silently ignored (api-compat #4-#8): half-honoured isolation is a security trap. `Config.Healthcheck` is accepted and dropped (api-compat #127).'
      operationId: ContainerCreate
      parameters:
      - name: name
        in: query
        description: 'Container name. Must satisfy SatL''s *service* naming rule -- dots are rejected, unlike Docker''s (api-compat #3). Omitted, the daemon generates one.'
        required: false
        schema:
          type: string
      - name: platform
        in: query
        description: '`os/arch[/variant]`. The variant is ignored, and a single component such as `freebsd` is a 400 where Docker would infer the rest (api-compat #9).'
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContainerCreateBody'
        required: true
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerCreateResponse'
        '400':
          description: Invalid body, name, platform, or an unsupported host option.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: The image is not present on this node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: The name is already taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Daemon error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: Not implemented by this daemon.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: This node is not a swarm manager, or no manager is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /containers/json:
    get:
      tags:
      - Container
      summary: '`GET /containers/json?all=`.'
      description: 'Lists the newest task per slot (api-compat #34): retained restart attempts are not listed as extra containers. `limit`, `size` and `filters` are ignored, there are no size fields, and each row carries an extra `Platform` (api-compat #12).'
      operationId: ContainerList
      parameters:
      - name: all
        in: query
        description: 'Include non-running containers. Docker `BoolValue` semantics: `?all=maybe` is true.'
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: 'Accepted and ignored (api-compat #12).'
        required: false
        schema:
          type: string
      - name: size
        in: query
        description: 'Accepted and ignored; no `SizeRw`/`SizeRootFs` is reported (api-compat #12).'
        required: false
        schema:
          type: string
      - name: filters
        in: query
        description: 'Accepted and ignored (api-compat #12).'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: One row per container.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContainerSummaryResponse'
        '500':
          description: Daemon error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: Not implemented by this daemon.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: This node is not a swarm manager, or no manager is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /containers/prune:
    post:
      tags:
      - Container
      summary: '`POST /containers/prune?filters=`.'
      description: 'Removes stopped containers **cluster-wide**, and with each one the service backing it, exactly as `DELETE /containers/{id}` does (api-compat #33, #129). `SpaceReclaimed` is measured before removal and can be short of the truth: a rootfs cannot be destroyed while its jail is still dying (api-compat #136). Any filter at all is a 400 rather than a silent no-op (api-compat #134).'
      operationId: ContainerPrune
      parameters:
      - name: filters
        in: query
        description: 'No filter is supported here; a non-empty value is a 400 (api-compat #134).'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: What was removed and how much was reclaimed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainersPruneResponse'
        '400':
          description: A filter was supplied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Daemon error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: Not implemented by this daemon.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: This node is not a swarm manager, or no manager is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /containers/{id}:
    delete:
      tags:
      - Container
      summary: '`DELETE /containers/{id}?force=&v=&link=`.'
      description: 'Removes a container. This deletes the backing Service as well -- otherwise the orchestrator would refill the slot with a new task the moment the reaper freed it (api-compat #33). `?v=` is a no-op and `?link=` is a 400 (api-compat #11).'
      operationId: ContainerDelete
      parameters:
      - name: id
        in: path
        description: Container (task) ID or name.
        required: true
        schema:
          type: string
      - name: force
        in: query
        description: 'Remove a running container. Docker `BoolValue` semantics: any value other than an empty string, `0`, `no`, `false` or `none` is true.'
        required: false
        schema:
          type: string
      - name: v
        in: query
        description: 'Accepted and a no-op: there are no anonymous volumes (api-compat #33).'
        required: false
        schema:
          type: string
      - name: link
        in: query
        description: 'Rejected with 400: there are no container links (api-compat #11).'
        required: false
        schema:
          type: string
      responses:
        '204':
          description: Removed.
        '400':
          description: '`?link=` was set.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: No such container.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: The container is running and `?force=` was not set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Daemon error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: Not implemented by this daemon.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: This node is not a swarm manager, or no manager is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /containers/{id}/exec:
    post:
      tags:
      - Exec
      summary: '`POST /containers/{id}/exec`.'
      description: 'Creates an exec instance. Exec is non-interactive: `Tty:true` is a 400 on create *and* on start, `Privileged:true` is a 400, `DetachKeys` is ignored, and stdin on the hijacked socket is read and discarded (api-compat #17, #38).'
      operationId: ContainerExec
      parameters:
      - name: id
        in: path
        description: Container (task) ID or name.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecCreateBody'
        required: true
      responses:
        '201':
          description: The exec instance was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecCreateResponse'
        '400':
          description: '`Tty` or `Privileged` was set, or the body is invalid.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: No such container.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: The container is not running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Daemon error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: Not implemented by this daemon.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: This node is not a swarm manager, or no manager is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /containers/{id}/json:
    get:
      tags:
      - Container
      summary: '`GET /containers/{id}/json`.'
      description: '`Platform` is `os/arch` where Docker sends a bare OS string, and there is a SatL-only `JailID`; `Driver` is always `zfs`, and `GraphDriver`, `HostnamePath`, `LogPath`, `ResolvConfPath`, `AppArmorProfile` and the size fields are absent (api-compat #13).'
      operationId: ContainerInspect
      parameters:
      - name: id
        in: path
        description: Container (task) ID or name.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The container document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerInspectResponse'
        '404':
          description: No such container.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Daemon error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: Not implemented by this daemon.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: This node is not a swarm manager, or no manager is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /containers/{id}/kill:
    post:
      tags:
      - Container
      summary: '`POST /containers/{id}/kill?signal=`.'
      description: 'Maps onto a graceful shutdown honouring the task''s stop signal, grace period and then SIGKILL: `?signal=` is accepted but not forwarded (api-compat #31). On a service task this retires the slot -- the service is *not* brought back to N/N (api-compat #146).'
      operationId: ContainerKill
      parameters:
      - name: id
        in: path
        description: Container (task) ID or name.
        required: true
        schema:
          type: string
      - name: signal
        in: query
        description: 'Accepted and not forwarded; defaults to `SIGKILL` (api-compat #31).'
        required: false
        schema:
          type: string
      responses:
        '204':
          description: Signalled.
        '404':
          description: No such container.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: The container is not running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Daemon error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: Not implemented by this daemon.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: This node is not a swarm manager, or no manager is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /containers/{id}/logs:
    get:
      tags:
      - Container
      summary: '`GET /containers/{id}/logs?follow=&stdout=&stderr=&tail=&timestamps=&since=`.'
      description: '**Not JSON.** The 200 body is a chunked stream of Docker multiplexed frames (8-byte header: stream byte, three zero bytes, big-endian payload length), always -- SatL never allocates a TTY, so the raw variant is never emitted even for `Tty:true` containers (api-compat #14). `?since=` is ignored and `timestamps=1` stamps read time, because the raw log files carry no per-line timestamps (api-compat #36).'
      operationId: ContainerLogs
      parameters:
      - name: id
        in: path
        description: Container (task) ID or name.
        required: true
        schema:
          type: string
      - name: follow
        in: query
        description: Keep the stream open. Docker `BoolValue` semantics.
        required: false
        schema:
          type: string
      - name: stdout
        in: query
        description: Include stdout. Docker `BoolValue` semantics.
        required: false
        schema:
          type: string
      - name: stderr
        in: query
        description: Include stderr. Docker `BoolValue` semantics.
        required: false
        schema:
          type: string
      - name: tail
        in: query
        description: '`all` or a line count.'
        required: false
        schema:
          type: string
      - name: timestamps
        in: query
        description: 'Prefix each line with the *read* time (api-compat #36).'
        required: false
        schema:
          type: string
      - name: since
        in: query
        description: 'Accepted and ignored (api-compat #36).'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: A stream of Docker multiplexed frames.
          content:
            application/vnd.docker.multiplexed-stream:
              schema:
                type: string
        '400':
          description: Neither stdout nor stderr was requested, or `?tail=` is unparsable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: No such container.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Daemon error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: Not implemented by this daemon.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: This node is not a swarm manager, or no manager is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /containers/{id}/start:
    post:
      tags:
      - Container
      summary: '`POST /containers/{id}/start`.'
      description: 'Starts a *created* container. A task is one-shot and immutable, so starting a container that has already run is a 409: re-running it would mean a new task, i.e. a new container ID, which Docker''s API cannot express (api-compat #30).'
      operationId: ContainerStart
      parameters:
      - name: id
        in: path
        description: Container (task) ID or name.
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Started.
        '304':
          description: Already running; nothing changed.
        '404':
          description: No such container.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: 'The container has already run once and cannot be restarted (api-compat #30).'
          content:
            application/json:
              schema:
