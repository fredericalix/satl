  /exec/{id}/start:
    post:
      tags:
      - Exec
      summary: '`POST /exec/{id}/start`.'
      description: '**Not JSON, and two shapes.** With `Connection: Upgrade` and `Upgrade: tcp` the daemon answers `101 Switching Protocols` with an empty body and then owns the raw socket, writing Docker multiplexed frames over it until the process exits. **Without** the upgrade headers it answers `200` with the same frames as an ordinary chunked body, where Docker would hijack in both cases (api-compat #18). Output is delivered when the process exits rather than streamed live (api-compat #38).'
      operationId: ExecStart
      parameters:
      - name: id
        in: path
        description: Exec instance ID.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecStartBody'
        required: true
      responses:
        '101':
          description: 'Connection hijacked: the raw socket now carries Docker multiplexed frames.'
        '200':
          description: 'No upgrade was requested: the same frames as a chunked body (api-compat #18).'
          content:
            application/vnd.docker.raw-stream:
              schema:
                type: string
        '400':
          description: '`Tty` was set, or the body is invalid.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: No such exec instance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: The exec instance has already run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Daemon error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: '`Detach` was set (api-compat #17), or the daemon has no executor wired.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: This node is not a swarm manager, or no manager is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
