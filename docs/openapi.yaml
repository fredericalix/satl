      - Paused
      - Restarting
      - OOMKilled
      - Dead
      - Pid
      - ExitCode
      - Error
      - StartedAt
      - FinishedAt
      properties:
        Dead:
          type: boolean
          description: Whether the container is in the `dead` state.
        Error:
          type: string
          description: Failure detail, empty when healthy.
        ExitCode:
          type: integer
          format: int64
          description: Exit code, 0 while running.
        FinishedAt:
          type: string
          description: Exit time, RFC 3339 nanoseconds (Go's zero time when still running).
        Health:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ContainerHealthResponse'
            description: |-
