          application/json:
            schema:
              $ref: '#/components/schemas/SwarmInitBody'
        required: true
      responses:
        '200':
          description: The manager's node ID, as a bare JSON string.
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Invalid body, or an address change that belongs in `satld.toml`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Daemon error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: '`ForceNewCluster` was set (api-compat #137), or the daemon has no store wired.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: This node is not a swarm manager, or no manager is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /swarm/join:
    post:
      tags:
      - Swarm
      summary: '`POST /swarm/join`.'
      description: 'Both token roles are accepted, and the token decides the role as in Docker (api-compat #43). The token format is `SATL-1-<digest>-<secret>`: the digest pins the CA bundle so a first contact over an untrusted channel cannot be MITM''d, and tooling that pattern-matches `SWMTKN` will not recognize it (api-compat #55).'
      operationId: SwarmJoin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwarmJoinBody'
        required: true
      responses:
        '200':
          description: Joined.
        '400':
          description: Invalid body or token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Daemon error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: Not implemented by this daemon.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: No manager was reachable at the given addresses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /swarm/leave:
    post:
      tags:
      - Swarm
      summary: '`POST /swarm/leave?force=`.'
      description: Leaves the cluster.
      operationId: SwarmLeave
      parameters:
      - name: force
        in: query
        description: Leave even when this node is the last manager. Docker `BoolValue` semantics.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Left.
        '500':
          description: Daemon error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: Not implemented by this daemon.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: 'Refused: this node is the last manager and `?force=` was not set.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /swarm/unlock:
    post:
      tags:
      - Swarm
      summary: |-
        `POST /swarm/unlock` on a *running* daemon: always a refusal. A daemon
        that actually is locked serves only this route (satld's locked listener);
        reaching it through the full router means the store is already open.
      description: 'The second of the two routes a **locked** manager serves (api-compat #151): it takes the operator''s unlock key and tries it against the sealed raft DEK, answering 200 on success and 401 on a wrong key. Reaching this operation through the full router means the store is already open, so a running daemon always answers 503 here.'
      operationId: SwarmUnlock
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnlockKeyBody'
        required: true
      responses:
        '200':
          description: The key opened the sealed store (locked daemon only).
        '400':
          description: '`UnlockKey` is missing or empty.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: The key does not open this manager's sealed store (locked daemon only).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: 'This swarm is not locked: the store is already open.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /swarm/unlockkey:
    get:
      tags:
      - Swarm
      summary: |-
        `GET /swarm/unlockkey`: the current unlock key, from the open store —
        manager-only, and meaningful only while autolock is on.
      description: 'The current unlock key, read from the open store. Manager-only, and meaningful only while autolock is on (api-compat #151).'
      operationId: SwarmUnlockkey
      responses:
        '200':
          description: The current unlock key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnlockKeyResponse'
        '500':
          description: Daemon error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: Not implemented by this daemon.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: This node is not a swarm manager, or no manager is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /swarm/update:
    post:
      tags:
      - Swarm
      summary: '`POST /swarm/update?rotateWorkerToken=&rotateManagerToken=`.'
      description: 'Applies exactly four kinds of update and refuses the rest with a 501 (api-compat #44): join-token rotation (the query flags), root CA rotation (a `CAConfig.ForceRotate` above the stored counter, api-compat #97), the manager autolock toggle (`EncryptionConfig.AutoLockManagers`) and unlock-key rotation (`?rotateManagerUnlockKey`, api-compat #151). The rest of the body''s spec is accepted and ignored, because Docker''s clients read-modify-write the whole spec. The response carries the updated `Swarm` document where Docker sends an empty body -- a superset clients discard (api-compat #44).'
      operationId: SwarmUpdate
      parameters:
      - name: version
        in: query
        description: 'Accepted but not enforced (api-compat #44).'
        required: false
        schema:
          type: string
      - name: rotateWorkerToken
        in: query
        description: Rotate the worker join token. Docker `BoolValue` semantics.
        required: false
        schema:
          type: string
      - name: rotateManagerToken
        in: query
        description: Rotate the manager join token. Docker `BoolValue` semantics.
        required: false
        schema:
          type: string
      - name: rotateManagerUnlockKey
        in: query
        description: 'Rotate the manager unlock key (api-compat #151). Docker `BoolValue` semantics.'
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwarmSpecBody'
        required: true
      responses:
        '200':
          description: The updated cluster document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwarmResponse'
        '400':
          description: Invalid body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Daemon error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: 'The request asked for a spec change SatL does not apply (api-compat #44).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: This node is not a swarm manager, or no manager is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /tasks:
    get:
      tags:
      - Task
      summary: '`GET /tasks?filters=`.'
      description: 'The only listing endpoint with real filtering: `id`, `name`, `service`, `node`, `desired-state` and `label` are understood, and any other key is a 400 (api-compat #47). Task documents omit `AssignedGenericResources`, `GenericResources` and `JobIteration` (api-compat #53), and `Status.ContainerStatus.ContainerID` carries the jail name, which is the bare task ID (api-compat #52).'
      operationId: TaskList
      parameters:
      - name: filters
        in: query
        description: 'JSON filter map; `id`, `name`, `service`, `node`, `desired-state` and `label` only (api-compat #47).'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: One row per task.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskResponse'
        '400':
          description: An unsupported filter key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Daemon error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: Not implemented by this daemon.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: This node is not a swarm manager, or no manager is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /tasks/{id}:
    get:
      tags:
      - Task
      summary: '`GET /tasks/{id}`.'
      description: 'One task. Tasks are immutable and one-shot (invariant #2): a restart is a replacement task in the same slot, not this one running again.'
      operationId: TaskInspect
      parameters:
      - name: id
        in: path
        description: Task ID.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The task document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '404':
          description: No such task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Daemon error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: Not implemented by this daemon.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: This node is not a swarm manager, or no manager is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /version:
    get:
      tags:
      - System
      summary: '`GET /version`: Docker `SystemVersion` document built from [`ApiState`].'
      description: 'Build and version identity of this daemon. No `GoVersion` and no `Experimental` field: SatL is not Go (api-compat, daemon-wide).'
      operationId: SystemVersion
      responses:
        '200':
          description: Daemon version document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
  /volumes:
    get:
      tags:
      - Volume
      summary: '`GET /volumes`.'
      description: 'Volumes on *this* node: a SatL volume is a node-local ZFS dataset (architecture section 10, api-compat #130). `Scope` is always `local`, `Status` always `{}`, there is no `UsageData`, filters are not read and `Warnings` is always empty (api-compat #20).'
      operationId: VolumeList
      responses:
        '200':
          description: The node's volumes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeListResponse'
        '500':
          description: Daemon error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: Not implemented by this daemon.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: This node is not a swarm manager, or no manager is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /volumes/create:
    post:
      tags:
      - Volume
      summary: '`POST /volumes/create`.'
      description: 'The `local` driver only -- any other driver is a 400 (api-compat #20). Labels and driver options are accepted but not persisted (api-compat #39).'
      operationId: VolumeCreate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VolumeCreateBody'
        required: true
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeResponse'
        '400':
          description: Invalid name, or a driver other than `local`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: A volume of that name already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Daemon error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: Not implemented by this daemon.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: This node is not a swarm manager, or no manager is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /volumes/prune:
    post:
      tags:
      - Volume
      summary: '`POST /volumes/prune?filters=`.'
      description: 'Removes unused volumes on **this node only**: a volume is a ZFS dataset on whichever node holds it (api-compat #130). Any filter at all is a 400 rather than a silent no-op (api-compat #134).'
      operationId: VolumePrune
      parameters:
      - name: filters
        in: query
        description: 'No filter is supported here; a non-empty value is a 400 (api-compat #134).'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: What was removed and how much was reclaimed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumesPruneResponse'
        '400':
          description: A filter was supplied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Daemon error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: Not implemented by this daemon.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: This node is not a swarm manager, or no manager is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /volumes/{name}:
    get:
      tags:
      - Volume
      summary: '`GET /volumes/{name}`.'
      description: 'Served from the node''s volume list: there is no separate inspect call behind it, and volume lists are node-local and short.'
      operationId: VolumeInspect
      parameters:
      - name: name
        in: path
        description: Volume name.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The volume document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeResponse'
        '404':
          description: No such volume on this node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Daemon error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: Not implemented by this daemon.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: This node is not a swarm manager, or no manager is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    delete:
      tags:
      - Volume
      summary: '`DELETE /volumes/{name}?force=`.'
      description: Destroys the node-local ZFS dataset behind the volume.
      operationId: VolumeDelete
      parameters:
      - name: name
        in: path
        description: Volume name.
        required: true
        schema:
          type: string
      - name: force
        in: query
        description: Remove even when in use. Docker `BoolValue` semantics.
        required: false
        schema:
          type: string
      responses:
        '204':
          description: Removed.
        '404':
          description: No such volume on this node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: The volume is in use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Daemon error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: Not implemented by this daemon.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: This node is not a swarm manager, or no manager is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
components:
  schemas:
    CaConfigWire:
      type: object
      description: '`CAConfig` of a cluster spec.'
      properties:
        ForceRotate:
          type: integer
          format: int64
          description: |-
            Root-rotation counter: a `POST /swarm/update` carrying a value
            greater than the stored one starts a root CA rotation (docker's
            `docker swarm ca --rotate` semantics).
          default: 0
          minimum: 0
        NodeCertExpiry:
          type: integer
          format: int64
          description: Validity of issued node certificates, in nanoseconds.
          default: 0
    ComponentVersion:
      type: object
      description: One entry of the `Components` list in [`VersionResponse`].
      required:
      - Name
      - Version
      - Details
      properties:
        Details:
          $ref: '#/components/schemas/EngineDetails'
          description: Engine build details.
        Name:
          type: string
          description: Component name (`Engine`).
        Version:
          type: string
          description: Component version.
    ConfigReferenceWire:
      type: object
      description: One `Configs` entry of a container spec.
      properties:
        ConfigID:
          type: string
          description: |-
            ID of the referenced config; may be empty, in which case the daemon
            resolves `ConfigName`.
          default: ''
        ConfigName:
          type: string
          description: Name of the referenced config.
          default: ''
        File:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/FileTargetWire'
            description: Where and how the payload is materialized.
          default: null
    ConfigResponse:
      type: object
      description: Docker's `Config` document (`GET /configs`, `GET /configs/{id}`).
      properties:
        CreatedAt:
          type: string
          description: Creation time, RFC 3339 nanoseconds.
          default: ''
        ID:
          type: string
          description: Config ID.
          default: ''
        Spec:
          oneOf:
          - $ref: '#/components/schemas/ConfigSpecWire'
            description: The spec, payload included (a config is not a secret).
          default:
            Name: ''
        UpdatedAt:
          type: string
          description: Last update time, RFC 3339 nanoseconds.
          default: ''
        Version:
          oneOf:
          - $ref: '#/components/schemas/ObjectVersionWire'
            description: Store version.
          default:
            Index: 0
    ConfigSpecWire:
      type: object
      description: |-
        `ConfigSpec`: like [`SecretSpecWire`] without `Driver` — Docker's config
        object has `Templating` but no driver plugins.
      properties:
        Data:
          type:
          - string
          - 'null'
          description: Base64-encoded payload. Required on create, rendered back on read.
          default: null
        Labels:
          type: object
          description: Free-form labels.
          default: {}
          additionalProperties:
            type: string
          propertyNames:
            type: string
        Name:
          type: string
          description: Config name (unique across the cluster).
          default: ''
        Templating:
          description: Templating driver — rejected (no template engine).
    ContainerCreateBody:
      type: object
      description: |-
        `POST /containers/create` body (Docker's `Config` + `HostConfig`).

        Every field is optional: clients omit what they do not use, and SatL
        ignores what it cannot honour (rejecting only the options whose silent
        omission would change the container's security or resource behaviour —
        see `crate::convert`).
      properties:
        AttachStdin:
          type: boolean
          description: Attach stdin (interactive run).
          default: false
        Cmd:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/StringOrList'
            description: Command / arguments.
          default: null
        Domainname:
          type:
          - string
          - 'null'
          description: Domain name (ignored — jails carry a single hostname).
          default: null
        Entrypoint:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/StringOrList'
            description: Entrypoint override.
          default: null
        Env:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Environment, `KEY=VALUE`.
          default: null
        ExposedPorts:
          type: object
          description: 'Ports the image declares (`{"80/tcp": {}}`).'
          default: {}
          additionalProperties: {}
          propertyNames:
            type: string
        HostConfig:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/HostConfigBody'
            description: Host-level options.
          default: null
        Hostname:
          type:
          - string
          - 'null'
          description: Hostname inside the container.
          default: null
        Image:
          type:
          - string
          - 'null'
          description: Image reference.
          default: null
        Labels:
          type:
          - object
          - 'null'
          description: Labels.
          default: null
          additionalProperties:
            type: string
          propertyNames:
            type: string
        OpenStdin:
          type: boolean
          description: Keep stdin open.
          default: false
        StopSignal:
          type:
          - string
          - 'null'
          description: Stop signal (accepted, applied by the runtime).
          default: null
        StopTimeout:
          type:
          - integer
          - 'null'
          format: int64
          description: Stop grace period in seconds.
          default: null
        Tty:
          type: boolean
          description: Allocate a pseudo-TTY.
          default: false
        User:
          type:
          - string
          - 'null'
          description: User to run as.
          default: null
        Volumes:
          type: object
          description: 'Anonymous volumes (`{"/data": {}}`).'
          default: {}
          additionalProperties: {}
          propertyNames:
            type: string
        WorkingDir:
          type:
          - string
          - 'null'
          description: Working directory.
          default: null
    ContainerCreateResponse:
      type: object
      description: '`POST /containers/create` response.'
      required:
      - Id
      - Warnings
      properties:
        Id:
          type: string
          description: New container ID (= Task ID).
        Warnings:
          type: array
          items:
            type: string
          description: Non-fatal notes.
    ContainerHealthResponse:
      type: object
      description: '`State.Health` of a container inspect document (Docker''s `Health`).'
      required:
      - Status
      - FailingStreak
      - Log
      properties:
        FailingStreak:
          type: integer
          format: int32
          description: Consecutive probe failures so far.
          minimum: 0
        Log:
          type: array
          items:
            $ref: '#/components/schemas/HealthLogEntryResponse'
          description: The last few probe results, oldest first.
        Status:
          type: string
          description: '`starting`, `healthy` or `unhealthy`.'
    ContainerInspectResponse:
      type: object
      description: '`GET /containers/{id}/json`.'
      required:
      - Id
      - Created
      - Path
      - Args
      - State
      - Image
      - Name
      - RestartCount
      - Driver
      - Platform
      - HostConfig
      - Config
      - NetworkSettings
      - Mounts
      properties:
        Args:
          type: array
          items:
            type: string
          description: Arguments to `Path`.
        Config:
          $ref: '#/components/schemas/InspectConfig'
          description: Container configuration.
        Created:
          type: string
          description: Creation time, RFC 3339 nanoseconds.
        Driver:
          type: string
          description: Storage driver — always `zfs`.
        HostConfig:
          $ref: '#/components/schemas/InspectHostConfig'
          description: Host configuration.
        Id:
          type: string
          description: Container ID.
        Image:
          type: string
          description: Image ID the container runs.
        JailID:
          type:
          - string
          - 'null'
          description: Jail ID — **SatL extension**.
        Mounts:
          type: array
          items:
            $ref: '#/components/schemas/MountPoint'
          description: Mounts.
        Name:
          type: string
          description: Name, with Docker's leading `/`.
        NetworkSettings:
          $ref: '#/components/schemas/InspectNetworkSettings'
          description: Addresses and published ports.
        Path:
          type: string
          description: Resolved entrypoint binary.
        Platform:
          type: string
          description: |-
            Resolved platform, `os/arch` — **SatL extension** (Docker sends
            `Platform` as a bare OS string).
        RestartCount:
