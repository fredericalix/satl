        required: false
        schema:
          type: string
      - name: until
        in: query
        description: 'Rejected with 501 (api-compat #21).'
        required: false
        schema:
          type: string
      - name: filters
        in: query
        description: 'Not read at all (api-compat #21).'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: One JSON object per line, not a JSON array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          description: '`?since=` is not a timestamp.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Daemon error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: '`?until=` was set, or the daemon has no event source wired.'
