[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
license = "BSD-2-Clause"
authors = ["Frederic Lempire"]
repository = "https://github.com/fredericalix/satl"
description = "Cluster-first container engine for FreeBSD (OCI jails, swarmkit-style orchestration)"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Triaged pedantic allows (see CLAUDE.md: triage, don't blanket-allow):
# - module_name_repetitions: our naming convention uses crate-qualified type names
# - missing_errors_doc / missing_panics_doc: error semantics live on the error types
# - must_use_candidate: too noisy on builder-style APIs; applied manually where it matters
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

# Dependencies (internal and external) are declared per-crate with
# `cargo add -p <crate>`; internal crates use direct path dependencies.
