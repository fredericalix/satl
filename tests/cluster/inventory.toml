# SatL test cluster inventory — THE single source of truth for node addresses.
#
# CLAUDE.md forbids hardcoding the VM addresses anywhere else in the tree.
# Every script in tests/cluster/ reads this file (through lib.sh) instead of
# embedding a hostname or an IP, so re-creating the VMs means editing this one
# file and nothing else. Roles are data too: no script may assume "node1 is the
# bootstrap manager" — it asks the inventory which node has role = "bootstrap".
#
# Topology (OVH Public Cloud, 3x FreeBSD 15.1-p2, 4 vCPU / 8 GiB, ZFS zroot):
#
#   vtnet0  public IP     — SSH from the dev host, container egress (NAT)
#   vtnet1  10.0.0.0/24   — the cluster underlay: Raft + dispatcher (M2),
#                           VXLAN overlay (M3). Never routed to the internet.
#
# The dev host (alpha) is NOT on 10.0.0.0/24 — it reaches the VMs over their
# public addresses only. See tests/cluster/README.md, "Images on the VMs".
#
# The `name` field is this suite's own identifier and nothing else: `satl node
# ls` names a node by the hostname its agent reported, and run.sh reads that
# real hostname over ssh (there is a regression guard that the HOSTNAME column
# never shows a config label). So these stay node1/2/3 while the machines call
# themselves fbsd1.satl.cc and friends.
#
# Values verified 2026-08-19 on the replacement VMs (the previous
# fbsd-dev---N.fredalix.ovh hosts no longer resolve). Re-verify with:
#   sh tests/cluster/run.sh        (checks private_ip against the live vtnet1)

[cluster]
ssh_user = "freebsd"
# Underlay interface and prefix that carry cluster traffic between nodes.
#
# This is a /24, where the previous cluster had a /16. It is not only a
# narrower mask: satld derives the VXLAN blackhole remote from the prefix as
# its last usable host (satld::underlay::blackhole_in), so the value moved from
# 10.2.255.254 to 10.0.0.254. Verified free on this fabric — silent to ping,
# ARP incomplete — and the only other live host on the /24 is 10.0.0.11, the
# OpenStack metadata helper. If that ever changes, satld.toml's
# `overlay_blackhole` is the override.
underlay_if = "vtnet1"
underlay_cidr = "10.0.0.0/24"
# Manager port: what `swarm init/join` advertise and listen on. satld's own
# default (satl-cluster::DEFAULT_PORT, docker's 2377); the CA listener is one
# above it. Here so no script has to spell an address, port included.
manager_port = "2377"
# Loopback-only test registry on each node (docs/image-sources.md).
registry_port = "5000"
registry_namespace = "satl-test"
registry_root = "/var/db/satl-test-registry"
# satld storage, mirroring docs/operations.md.
zfs_root = "zroot/satl"
state_dir = "/var/db/satl"
prefix = "/usr/local"

# Exactly one node must have role = "bootstrap" (it runs `satl swarm init`);
# every node with role = "joiner" joins it with the manager token.
[[node]]
name = "node1"
ssh_host = "fbsd1.satl.cc"
public_ip = "57.128.42.47"
private_ip = "10.0.0.101"
role = "bootstrap"

[[node]]
name = "node2"
ssh_host = "fbsd2.satl.cc"
public_ip = "141.94.214.2"
private_ip = "10.0.0.102"
role = "joiner"

[[node]]
name = "node3"
ssh_host = "fbsd3.satl.cc"
public_ip = "57.128.56.91"
private_ip = "10.0.0.103"
role = "joiner"
